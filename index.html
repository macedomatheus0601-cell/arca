<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Cliente — Consultoria Financeira</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b78e0'/%3E%3Cstop offset='1' stop-color='%2314337d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='23' fill='url(%23b)'/%3E%3Cg transform='rotate(135 50 53)'%3E%3Ccircle cx='50' cy='53' r='33' fill='none' stroke='%23ffffff' stroke-opacity='.26' stroke-width='9.5' stroke-linecap='round' stroke-dasharray='155.5 51.9'/%3E%3Ccircle cx='50' cy='53' r='33' fill='none' stroke='%23a9eed2' stroke-width='9.5' stroke-linecap='round' stroke-dasharray='108.9 98.5'/%3E%3C/g%3E%3Cpolyline points='35,63 47,50 66,37' fill='none' stroke='%23ffffff' stroke-width='7.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='66' cy='37' r='6' fill='%237fe6bd'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c4fa6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg:#eef0f4; --bg2:#e7eaf0; --card:#ffffff; --card2:#f5f6f9;
    --border:#e6e8ee; --border-strong:#d7dae2;
    --text:#141821; --text2:#565d6b; --muted:#9198a5;
    --brand:#2560c8; --brand2:#1c4fa6;
    --green:#0f9d6b; --green-bg:#e4f6ee;
    --amber:#d1810a; --amber-bg:#fbeed6;
    --teal:#0a97b0; --teal-bg:#dff3f6;
    --rose:#dc4b52; --rose-bg:#fce7e8;
    --slate:#6b7385; --slate-bg:#eceef3;
    --grad-hero:linear-gradient(140deg,#2f6bd6 0%,#163f8f 100%);
    --grad-foco:linear-gradient(135deg,#109c7e 0%,#0b8ea4 100%);
    --shadow:0 4px 18px rgba(30,40,70,.08); --shadow-lg:0 12px 34px rgba(30,40,70,.14);
  }
  :root[data-theme="dark"] {
    --bg:#0c0e13; --bg2:#101319; --card:#171a21; --card2:#1f232c;
    --border:#262b35; --border-strong:#333a46;
    --text:#f0f1f4; --text2:#aab2c0; --muted:#727a89;
    --brand:#5b8bf5; --brand2:#3a6ad8;
    --green:#35c98e; --green-bg:#10281f;
    --amber:#e0a13c; --amber-bg:#2c2210;
    --teal:#3bb9cf; --teal-bg:#0e2429;
    --rose:#ec6d73; --rose-bg:#2c1517;
    --slate:#8d94a5; --slate-bg:#1e222b;
    --grad-hero:linear-gradient(140deg,#2a5cc0 0%,#143a80 100%);
    --grad-foco:linear-gradient(135deg,#0e8a6e 0%,#0a7f95 100%);
    --shadow:0 4px 18px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.5);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
         font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .3s,color .3s; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select { font-family:inherit; }

  /* ---------- LOGIN ---------- */
  .login-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; background:radial-gradient(900px 500px at 50% -10%,var(--bg2),var(--bg)); }
  .login-card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:30px 26px; width:100%; max-width:380px; box-shadow:var(--shadow-lg); }
  .login-mark { width:54px; height:54px; border-radius:16px; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:var(--shadow); }
  .login-mark svg { width:28px; height:28px; }
  .login-card h1 { font-size:20px; font-weight:750; text-align:center; letter-spacing:-.3px; }
  .login-card .lsub { font-size:13px; color:var(--muted); text-align:center; margin:4px 0 22px; }
  .field { margin-bottom:13px; }
  .field label { font-size:12.5px; color:var(--text2); font-weight:600; display:block; margin-bottom:5px; }
  .field input { width:100%; height:46px; padding:0 14px; border-radius:12px; border:1px solid var(--border-strong); background:var(--card2); color:var(--text); font-size:15px; outline:none; transition:border-color .15s; }
  .field input:focus { border-color:var(--brand); }
  .login-btn { width:100%; height:47px; border-radius:12px; background:var(--grad-hero); color:#fff; font-size:15px; font-weight:700; margin-top:8px; transition:transform .1s,opacity .2s; }
  .login-btn:active { transform:scale(.98); }
  .login-btn:disabled { opacity:.6; cursor:default; }
  .login-err { background:var(--rose-bg); color:var(--rose); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:10px; margin-bottom:14px; display:none; }
  .login-err.show { display:block; }
  .login-ok { background:var(--green-bg); color:var(--green); font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:10px; margin-bottom:14px; display:none; }
  .login-ok.show { display:block; }
  .login-opts { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:2px 0 4px; }
  .chk-lembrar { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text2); cursor:pointer; }
  .chk-lembrar input { width:16px; height:16px; accent-color:var(--brand); cursor:pointer; }
  .link-btn { font-size:12.5px; color:var(--brand); font-weight:600; padding:0; }
  .link-btn:hover { text-decoration:underline; }

  /* ---------- SHELL ---------- */
  .shell { display:none; min-height:100vh; }
  .shell.show { display:grid; grid-template-columns:232px 1fr; transition:grid-template-columns .22s ease; }
  .shell.show.nav-hidden { grid-template-columns:0px 1fr; }
  .sidebar { background:var(--card); border-right:1px solid var(--border); padding:18px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden; }
  .shell.nav-hidden .sidebar { padding-left:0; padding-right:0; border-right-color:transparent; }
  .shell.nav-hidden .sidebar > * { opacity:0; pointer-events:none; transition:opacity .12s; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; }
  .brand .mark { width:38px; height:38px; border-radius:11px; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark svg { width:20px; height:20px; }
  .brand .bname { font-weight:750; font-size:15px; letter-spacing:-.3px; white-space:nowrap; }
  .brand .bsub { font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .nav { display:flex; flex-direction:column; gap:3px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--text2); font-size:14px; font-weight:600; width:100%; text-align:left; white-space:nowrap; transition:background .15s,color .15s; }
  .nav-item svg { width:19px; height:19px; flex-shrink:0; }
  .nav-item:hover { background:var(--card2); color:var(--text); }
  .nav-item.active { background:color-mix(in srgb,var(--brand) 13%,transparent); color:var(--brand); }
  .side-foot { border-top:1px solid var(--border); padding-top:12px; margin-top:8px; display:flex; align-items:center; gap:10px; }
  .side-foot .u-name { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-foot .u-role { font-size:10.5px; color:var(--muted); }
  .sair-btn { width:32px; height:32px; border-radius:9px; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sair-btn svg { width:17px; height:17px; }
  .sair-btn:hover { background:var(--rose-bg); color:var(--rose); }

  .main { padding:22px 26px 60px; max-width:1000px; width:100%; }
  .main-top { display:flex; align-items:center; gap:11px; margin-bottom:20px; }
  .page-title { font-size:22px; font-weight:780; letter-spacing:-.4px; flex:1; min-width:0; }
  .top-btn { width:42px; height:42px; border-radius:12px; border:1px solid var(--border-strong); background:var(--card); color:var(--text2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; transition:transform .1s,border-color .2s; }
  .top-btn:hover { border-color:var(--brand); color:var(--brand); }
  .top-btn:active { transform:scale(.92); }
  .top-btn svg { width:19px; height:19px; }
  .avatar { width:46px; height:46px; border-radius:14px; flex-shrink:0; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; box-shadow:var(--shadow); }

  @media (max-width:820px) {
    .shell.show, .shell.show.nav-hidden { grid-template-columns:1fr; }
    .sidebar { position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; border-right:none; border-top:1px solid var(--border); padding:7px 8px !important; z-index:50; overflow:visible; box-shadow:0 -4px 18px rgba(0,0,0,.07); }
    .shell.nav-hidden .sidebar > * { opacity:1; pointer-events:auto; }
    .brand, .side-foot { display:none; }
    .nav { flex-direction:row; gap:2px; }
    .nav-item { flex-direction:column; gap:3px; padding:7px 3px; font-size:9.5px; border-radius:10px; justify-content:center; }
    .nav-item svg { width:21px; height:21px; }
    .main { padding:18px 15px 92px; }
    #menuBtn { display:none; }
  }

  .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:800; margin:26px 2px 12px; }
  .eyebrow:first-child { margin-top:4px; }

  /* ---------- HERO ---------- */
  .hero { background:var(--grad-hero); border-radius:22px; color:#fff; padding:22px; box-shadow:var(--shadow-lg); position:relative; overflow:hidden; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .hero::after { content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.10); }
  .hero::before { content:""; position:absolute; right:40px; bottom:-80px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.07); }
  .gauge-wrap { position:relative; width:168px; height:168px; flex-shrink:0; z-index:1; }
  .gauge-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-score { font-size:46px; font-weight:800; line-height:1; letter-spacing:-1px; }
  .gauge-of { font-size:12px; opacity:.8; margin-top:3px; }
  .hero-info { flex:1; min-width:180px; z-index:1; }
  .hero-tag { font-size:11.5px; text-transform:uppercase; letter-spacing:1px; opacity:.82; font-weight:700; }
  .hero-title { font-size:22px; font-weight:750; margin:5px 0 3px; letter-spacing:-.4px; }
  .hero-desc { font-size:13.5px; opacity:.9; line-height:1.5; margin-bottom:14px; }
  .pillars { display:flex; gap:8px; flex-wrap:wrap; }
  .pillar { background:rgba(255,255,255,.14); border-radius:12px; padding:8px 11px; flex:1; min-width:96px; }
  .pillar .p-lbl { font-size:10.5px; opacity:.82; display:flex; align-items:center; gap:5px; }
  .pillar .p-val { font-size:16px; font-weight:700; margin-top:3px; }
  .p-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }

  /* ---------- TILES ---------- */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:13px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); transition:transform .15s,box-shadow .15s; }
  .tile:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .chip { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .chip svg { width:20px; height:20px; }
  .chip.blue { background:color-mix(in srgb,var(--brand) 15%,transparent); color:var(--brand); }
  .chip.green { background:var(--green-bg); color:var(--green); }
  .chip.amber { background:var(--amber-bg); color:var(--amber); }
  .chip.teal { background:var(--teal-bg); color:var(--teal); }
  .chip.rose { background:var(--rose-bg); color:var(--rose); }
  .chip.slate { background:var(--slate-bg); color:var(--slate); }
  .t-label { font-size:12.5px; color:var(--text2); }
  .t-value { font-size:25px; font-weight:780; letter-spacing:-.6px; margin-top:3px; font-variant-numeric:tabular-nums; }
  .t-foot { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:11.5px; font-weight:600; }
  .badge { padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .badge.g { background:var(--green-bg); color:var(--green); }
  .badge.y { background:var(--amber-bg); color:var(--amber); }
  .badge.r { background:var(--rose-bg); color:var(--rose); }
  .badge.n { background:var(--slate-bg); color:var(--slate); }
  .badge.b { background:color-mix(in srgb,var(--brand) 14%,transparent); color:var(--brand); }
  .spark { margin-top:10px; }

  .foco { background:var(--grad-foco); color:#fff; border-radius:20px; padding:20px 22px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:16px; }
  .foco .f-ic { width:52px; height:52px; border-radius:15px; flex-shrink:0; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; }
  .foco .f-ic svg { width:26px; height:26px; }
  .foco .f-tag { font-size:11px; text-transform:uppercase; letter-spacing:.8px; opacity:.85; font-weight:700; }
  .foco .f-title { font-size:18px; font-weight:750; margin:3px 0 4px; letter-spacing:-.3px; }
  .foco .f-desc { font-size:13px; opacity:.92; line-height:1.45; }

  .goals { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:13px; }
  .goal { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); display:flex; gap:14px; align-items:center; }
  .ring-wrap { position:relative; flex-shrink:0; width:68px; height:68px; }
  .ring-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:750; }
  .goal .g-body { flex:1; min-width:0; }
  .goal .g-name { font-size:15px; font-weight:720; display:flex; align-items:center; gap:7px; }
  .goal .g-name .mini-ic { width:15px; height:15px; }
  .goal .g-vals { font-size:12.5px; color:var(--text2); margin:5px 0 6px; font-variant-numeric:tabular-nums; }
  .goal .g-vals b { color:var(--text); }
  .goal .g-when { font-size:11px; color:var(--muted); display:inline-flex; align-items:center; gap:5px; background:var(--card2); padding:3px 9px; border-radius:20px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
  .card + .card { margin-top:13px; }
  .card-h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .card-h .ct { font-size:15px; font-weight:730; }
  .card-h .cs { font-size:12px; color:var(--muted); margin-top:1px; }
  .card-h .c-end { text-align:right; }
  .card-h .c-end .lbl { font-size:11px; color:var(--muted); }
  .card-h .c-end .val { font-size:20px; font-weight:780; color:var(--brand); letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .legend { display:flex; gap:14px; font-size:11.5px; color:var(--text2); margin:4px 0 8px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .sw { width:11px; height:11px; border-radius:3px; display:inline-block; flex-shrink:0; }
  .ln { width:20px; height:3px; border-radius:2px; display:inline-block; background:var(--brand); }
  .ln.d { background:repeating-linear-gradient(90deg,var(--brand) 0 3px,transparent 3px 7px); }
  svg.chart { width:100%; height:auto; display:block; }
  .cap { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .note { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .disclaimer { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:11px 13px; font-size:11.5px; color:var(--text2); line-height:1.5; margin-top:14px; }

  /* ---------- metas ---------- */
  .goal-full { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:13px; }
  .gf-top { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .gf-body { flex:1; min-width:200px; }
  .gf-name { font-size:16px; font-weight:740; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .gf-name .ic { width:18px; height:18px; display:inline-flex; flex-shrink:0; }
  .gf-vals { font-size:13px; color:var(--text2); margin:7px 0 5px; font-variant-numeric:tabular-nums; }
  .gf-vals b { color:var(--text); }
  .track { height:9px; background:var(--card2); border-radius:5px; overflow:hidden; }
  .fill { height:100%; border-radius:5px; }
  .gf-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-top:15px; padding-top:14px; border-top:1px solid var(--border); }
  .mini { background:var(--card2); border-radius:12px; padding:10px 12px; }
  .mini .m-l { font-size:11px; color:var(--muted); }
  .mini .m-v { font-size:16px; font-weight:730; margin-top:2px; font-variant-numeric:tabular-nums; }

  /* barras comparativas com rótulo (sem ambiguidade) */
  .cmp { margin-top:14px; padding-top:13px; border-top:1px solid var(--border); }
  .cmp-t { font-size:12px; font-weight:700; color:var(--text2); margin-bottom:9px; }
  .cmp-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:12.5px; }
  .cmp-row .cr-l { width:118px; flex-shrink:0; color:var(--text2); }
  .cmp-row .cr-bar { flex:1; height:16px; background:var(--card2); border-radius:5px; overflow:hidden; min-width:50px; }
  .cmp-row .cr-f { height:100%; border-radius:5px; }
  .cmp-row .cr-v { width:92px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0; }

  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:13px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px; box-shadow:var(--shadow); }
  .stat .s-l { font-size:12px; color:var(--text2); display:flex; align-items:center; gap:7px; }
  .stat .s-v { font-size:21px; font-weight:770; margin-top:6px; letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .sign { width:21px; height:21px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0; }

  /* ---------- tabela ---------- */
  .tbl-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:14px; margin-top:14px; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:400px; }
  th { text-align:right; padding:9px 12px; font-weight:700; color:var(--text2); background:var(--card2); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  td { padding:9px 12px; border-top:1px solid var(--border); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  tfoot td { border-top:2px solid var(--border-strong); font-weight:750; background:var(--card2); }
  .pos { color:var(--green); } .neg { color:var(--rose); }

  /* ---------- donut ---------- */
  .donut-row { display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .donut-box { position:relative; width:190px; flex-shrink:0; margin:0 auto; }
  .donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .donut-center .dc-v { font-size:18px; font-weight:780; letter-spacing:-.4px; }
  .donut-center .dc-l { font-size:11px; color:var(--muted); }
  .dleg { flex:1; min-width:190px; }
  .dleg-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--border); font-size:13px; }
  .dleg-row:first-child { border-top:none; }
  .dleg-row .dl-n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dleg-row .dl-v { font-weight:680; font-variant-numeric:tabular-nums; }

/* ================= SUPABASE ================= */
const SUPABASE_URL="https://famyaxiruknwzbdktghf.supabase.co";

/* ================= ESTADO ================= */
let F={}, metas=[], perfilData=null, compsData=[], objsData=[], apsData=[];
let currentPage="inicio", extraPoupanca=0, isHost=false;
const CDI_PADRAO=0.105, PCT_CDI_PADRAO=1.00;

/* ================= HELPERS ================= */
const fmt = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const fmtK = v => Math.abs(v)>=1000 ? "R$ "+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k" : fmt(v);
const pct1 = v => (v*100).toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number(v)||0;
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function mesAno(d){ if(!d) return ""; const dt=new Date(d+"T00:00:00"); return MESES[dt.getMonth()]+"/"+dt.getFullYear(); }
function labelMes(off){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+off); return MESES[d.getMonth()]+"/"+String(d.getFullYear()).slice(2); }
function dataBR(d){ if(!d) return null; const dt=new Date(d+"T00:00:00"); return String(dt.getDate()).padStart(2,'0')+"/"+String(dt.getMonth()+1).padStart(2,'0')+"/"+dt.getFullYear(); }
function idade(d){ if(!d) return null; const n=new Date(),b=new Date(d+"T00:00:00"); let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate())) a--; return a; }

/* ================= CARREGAR DADOS ================= */
async function loadData(attempt=1){
  const body=document.getElementById("pageContent");
  body.innerHTML=`<div class="state"><div class="big">⏳</div>Carregando seus dados...</div>`;
  try{
    const [pr,cr,or,ar,ur]=await Promise.all([
      sb.from("perfis").select("*").eq("ativo",true).limit(1),
      sb.from("compromissos_recorrentes").select("*").eq("ativo",true),
      sb.from("objetivos").select("*").eq("status","ativo").order("prioridade",{ascending:true}),
      sb.from("aplicacoes").select("*"),
      sb.from("usuarios").select("role").limit(1),
    ]);
    if(pr.error) throw pr.error; if(cr.error) throw cr.error; if(or.error) throw or.error;
    const perfil=(pr.data||[])[0];
    if(!perfil){ body.innerHTML=`<div class="state"><div class="big">📋</div>Ainda não há dados cadastrados para o seu perfil.<br>Fale com seu consultor.</div>`; return; }
    perfilData=perfil; compsData=cr.data||[]; objsData=or.data||[];
    apsData = ar.error ? [] : (ar.data||[]);           /* tabela pode não existir ainda */
    isHost = !ur.error && ((ur.data||[])[0]||{}).role==="host";

    const renda=compsData.filter(c=>c.tipo==="receita").reduce((s,c)=>s+num(c.valor),0);
    const fixos=compsData.filter(c=>c.tipo==="despesa").reduce((s,c)=>s+num(c.valor),0);
    const parcelaDivida=compsData.filter(c=>c.tipo==="despesa"&&c.eh_divida).reduce((s,c)=>s+num(c.valor),0);
    const investido=apsData.reduce((s,a)=>s+num(a.valor_atual),0);
    const reservaAps=apsData.filter(a=>a.eh_reserva).reduce((s,a)=>s+num(a.valor_atual),0);
    const reserva = reservaAps>0 ? reservaAps : num(perfil.reserva_atual);
    const sobra = perfil.poupanca_mensal_atual!=null ? num(perfil.poupanca_mensal_atual) : (renda-fixos);
    const variaveis = Math.max(0, renda-fixos-sobra);
    /* A reserva cobre o CUSTO DE VIDA MENSAL (fixos + variáveis), não só os fixos.
       Renda instável (autônomo/PJ) pede reserva maior — prática de mercado. */
    const gastoMensal = fixos + variaveis;
    const rendaInstavel = /aut[oô]nomo|pj|empres|liberal|comiss/i.test(perfil.tipo_renda||"");
    const mesesIdeal = rendaInstavel ? 9 : 6;
    F={ nome:perfil.nome||"você", inicial:(perfil.iniciais||(perfil.nome||"?")[0]||"?").toUpperCase(),
        renda, fixos, reserva, investido, parcelaDivida, sobra, variaveis, gastoMensal, mesesIdeal, rendaInstavel,
        reservaIdeal: gastoMensal*mesesIdeal,
        taxa:renda>0?sobra/renda:0, mesesReserva:gastoMensal>0?reserva/gastoMensal:0, divida:renda>0?parcelaDivida/renda:0,
        cdi: perfil.cdi_anual!=null?num(perfil.cdi_anual):CDI_PADRAO,
        pctCdi: perfil.pct_cdi!=null?num(perfil.pct_cdi):PCT_CDI_PADRAO };
    metas=objsData.map(o=>{ const st=GOAL_STYLE[o.tipo]||GOAL_STYLE.outro;
      return { nome:o.descricao||o.tipo, tipo:o.tipo, ic:st.ic, corVar:st.cor, cor:cssv(st.cor),
               atual:num(o.valor_atual), alvo:num(o.valor_alvo), dataAlvo:o.data_alvo,
               quando:o.data_alvo?"meta "+mesAno(o.data_alvo):"" }; });
    document.getElementById("sideAvatar").textContent=F.inicial;
    document.getElementById("sideName").textContent=F.nome;
    document.getElementById("sideRole").textContent=isHost?"consultor":"cliente";
    setPage(currentPage);
  }catch(e){
    const msg=(e&&e.message)?e.message:String(e);
    if(/future|iat|issued|JWT/i.test(msg)&&attempt<4){
      body.innerHTML=`<div class="state"><div class="big">⏳</div>Sincronizando com o servidor... (${attempt}/3)</div>`;
      await new Promise(r=>setTimeout(r,2000)); return loadData(attempt+1);
    }
    body.innerHTML=`<div class="state"><div class="big">⚠️</div>Não consegui carregar os dados.<br><span style="font-size:12px">${esc(msg)}</span></div>`;
  }
}

/* ================= MOTOR DE CÁLCULO ================= */
function ativoNoMes(c,off){
  const hoje=new Date(), alvo=new Date(hoje.getFullYear(),hoje.getMonth()+off,1);
  if(c.data_fim){ if(new Date(c.data_fim+"T00:00:00")<alvo) return false; }
  else if(c.total_parcelas!=null&&c.parcela_atual!=null){
    if(off > Number(c.total_parcelas)-Number(c.parcela_atual)) return false;
  }
  if(c.data_inicio && new Date(c.data_inicio+"T00:00:00") > new Date(alvo.getFullYear(),alvo.getMonth()+1,0)) return false;
  return true;
}
const receitaMes = off => compsData.filter(c=>c.tipo==="receita"&&ativoNoMes(c,off)).reduce((s,c)=>s+num(c.valor),0);
const fixosMes   = off => compsData.filter(c=>c.tipo==="despesa"&&ativoNoMes(c,off)).reduce((s,c)=>s+num(c.valor),0);
function projetar(n=24, extra=0){
  const out=[]; let saldo=F.reserva;
  out.push({off:0,receita:receitaMes(0),despesa:fixosMes(0)+F.variaveis,sobra:F.sobra,saldo});
  for(let i=1;i<=n;i++){
    const rec=receitaMes(i), desp=fixosMes(i)+F.variaveis, sob=rec-desp+extra;
    saldo+=sob; out.push({off:i,receita:rec,despesa:desp,sobra:sob,saldo});
  }
  return out;
}
function planoAlocacao(extra=0, horizonte=120){
  const itens=metas.map(m=>({nome:m.nome,cor:m.cor,ic:m.ic,falta:Math.max(0,m.alvo-m.atual),mes:null}));
  const proj=projetar(horizonte,extra);
  for(let i=1;i<=horizonte;i++){
    let disp=proj[i]?proj[i].sobra:0;
    if(disp<=0) continue;
    for(const it of itens){
      if(it.mes!==null||it.falta<=0) continue;
      if(disp<=0) break;
      const usa=Math.min(disp,it.falta); it.falta-=usa; disp-=usa;
      if(it.falta<=0.01) it.mes=i;
    }
    if(itens.every(it=>it.mes!==null)) break;
  }
  return itens;
}
function calcScore(){
  const pPoup=Math.max(0,Math.min(1,F.taxa/0.20)), pDiv=Math.max(0,Math.min(1,1-F.divida/0.30)),
        pRes=Math.max(0,Math.min(1,F.mesesReserva/(F.mesesIdeal||6)));
  return { score:Math.round((pPoup*0.34+pDiv*0.30+pRes*0.36)*100), pPoup, pDiv, pRes };
}
function focoInfo(){
  const mi=F.mesesIdeal||6;
  if(F.divida>=0.30) return {t:"Reduzir as dívidas caras",d:"Suas dívidas consomem uma fatia grande da renda. O primeiro passo é aliviar isso — é o que destrava o resto."};
  if(F.mesesReserva<mi/2) return {t:"Completar sua reserva de emergência",d:`Você tem hoje ${F.mesesReserva.toLocaleString("pt-BR",{maximumFractionDigits:1})} meses de custo de vida guardados. O primeiro passo é chegar a ${mi} meses (${fmt(F.reservaIdeal)})${F.rendaInstavel?", que é o recomendado para quem tem renda variável":""} — é o que traz segurança antes de mirar os outros objetivos.`};
  if(F.taxa<0.10) return {t:"Organizar e sobrar mais",d:"Sobra pouco no fim do mês. Vamos mapear os gastos e liberar mais espaço para as suas metas."};
  return {t:"Acelerar seus objetivos",d:"Sua base está saudável! Agora é hora de dar velocidade às suas metas e fazer o dinheiro render mais."};
}
/* juros compostos: aporte mensal + montante inicial */
function montante(p0, pmt, taxaMes, n){
  if(taxaMes<=0) return p0+pmt*n;
  return p0*Math.pow(1+taxaMes,n) + pmt*((Math.pow(1+taxaMes,n)-1)/taxaMes);
}
const taxaMensal = () => Math.pow(1+F.cdi*F.pctCdi, 1/12)-1;
/* Projeção de aplicação usando a sobra REAL de cada mês (cresce quando parcelas acabam) */
function projetarAplicado(n){
  const proj=projetar(n,0), i=taxaMensal();
  let parado=F.investido||F.reserva, aplic=parado;
  const A=[parado], B=[aplic];
  for(let k=1;k<=n;k++){
    const s=Math.max(0,proj[k].sobra);
    parado+=s; aplic=aplic*(1+i)+s;
    A.push(parado); B.push(aplic);
  }
  return {A,B};
}
/* IR regressivo da renda fixa, aplicado só sobre o ganho */
const aliquotaIR = meses => meses<=6 ? 0.225 : meses<=12 ? 0.20 : meses<=24 ? 0.175 : 0.15;

/* rótulo com enquadramento seguro (não corta nas bordas) */

/* FLUXO: entradas acima do eixo, saídas abaixo, saldo como linha */
function fluxoSvg(proj,n=12){
  const d=proj.slice(1,n+1);
  const W=720,H=320,padT=22,padB=42,padL=10,padR=10;
  const maxAbs=Math.max(...d.map(p=>Math.max(p.receita,p.despesa)))*1.14||1;
  const plotH=H-padT-padB, zero=padT+plotH/2, half=plotH/2;
  const y=v=>zero-(v/maxAbs)*half;
  const gw=(W-padL-padR)/d.length, bw=Math.min(16,gw*0.32);
  const green=cssv("--green"),rose=cssv("--rose"),tick=cssv("--muted"),grid=cssv("--border"),text=cssv("--text"),card=cssv("--card");
  let g="";
  [0.5,1].forEach(f=>{ [1,-1].forEach(s=>{ const gy=zero-s*f*half;
    g+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`; }); });
  g+=`<text x="${padL+2}" y="${(zero-half+11).toFixed(1)}" fill="${tick}" font-size="10.5" font-family="Segoe UI,sans-serif">${fmtK(maxAbs)}</text>`;
  g+=`<text x="${padL+2}" y="${(zero+half-3).toFixed(1)}" fill="${tick}" font-size="10.5" font-family="Segoe UI,sans-serif">-${fmtK(maxAbs)}</text>`;
  let bars="",lin=[];
  d.forEach((p,i)=>{
    const cx=padL+gw*i+gw/2;

    bars+=`<rect x="${(cx-bw-1.5).toFixed(1)}" y="${y(p.receita).toFixed(1)}" width="${bw.toFixed(1)}" height="${hr.toFixed(1)}" rx="3.5" fill="${green}"/>`;
    bars+=`<rect x="${(cx+1.5).toFixed(1)}" y="${zero.toFixed(1)}" width="${bw.toFixed(1)}" height="${hd.toFixed(1)}" rx="3.5" fill="${rose}"/>`;
    lin.push([cx,y(p.sobra)]);
    if(i%2===0||d.length<=8) bars+=`<text x="${cx.toFixed(1)}" y="${H-22}" fill="${tick}" font-size="10.5" text-anchor="${txtAnchor(cx,W,26)}" font-family="Segoe UI,sans-serif">${labelMes(p.off)}</text>`;
  });
  const lp=lin.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Entradas, saídas e saldo por mês">
    ${g}${bars}
    <line x1="${padL}" y1="${zero.toFixed(1)}" x2="${W-padR}" y2="${zero.toFixed(1)}" stroke="${cssv("--border-strong")}" stroke-width="1.6"/>
    <polyline points="${lp}" fill="none" stroke="${text}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}
    <text x="${W-padR}" y="${H-5}" fill="${tick}" font-size="10" text-anchor="end" font-family="Segoe UI,sans-serif">a linha preta é o saldo do mês</text></svg>`;
}

/* linha do tempo das metas — rótulos sempre enquadrados */

  document.getElementById("pageTitle").textContent=pg.titulo;
  renderNav();
  if(F.renda!=null){ metas.forEach(m=>m.cor=cssv(m.corVar)); pg.render(); }
  window.scrollTo({top:0});
}

/* ================= PÁGINA: METAS ================= */
function renderMetas(){
  const box=document.getElementById("pageContent");
  if(!metas.length){ box.innerHTML=`<div class="state"><div class="big">🎯</div>Nenhuma meta cadastrada ainda.<br>Fale com seu consultor para definir seus objetivos.</div>`; return; }
  const totAlvo=metas.reduce((s,m)=>s+m.alvo,0), totAtual=metas.reduce((s,m)=>s+m.atual,0);
  const pg=totAlvo>0?Math.round(totAtual/totAlvo*100):0;
  const plano=planoAlocacao(0);
  const concl=plano.filter(p=>p.mes!==null).length;

  const resumo=`<div class="card"><div class="donut-row">
      <div class="ring-wrap" style="width:104px;height:104px">${ringSvg(pg,cssv("--brand"),8)}<div class="ring-pct" style="color:${cssv("--brand")};font-size:20px">${pg}%</div></div>
      <div style="flex:1;min-width:200px">
        <div style="font-size:12.5px;color:var(--text2)">Progresso geral das metas</div>
        <div style="font-size:26px;font-weight:790;letter-spacing:-.6px;margin-top:2px">${fmt(totAtual)}</div>
        <div style="font-size:13px;color:var(--muted)">de ${fmt(totAlvo)} · faltam <b style="color:var(--text)">${fmt(Math.max(0,totAlvo-totAtual))}</b></div>
        <div class="track" style="margin-top:11px"><div class="fill" style="width:${pg}%;background:${cssv("--brand")}"></div></div>
      </div>
      <div style="min-width:148px">
        <div class="mini" style="margin-bottom:8px"><div class="m-l">Metas ativas</div><div class="m-v">${metas.length}</div></div>
        <div class="mini"><div class="m-l">Alcançáveis em 10 anos</div><div class="m-v">${concl} de ${metas.length}</div></div>
      </div></div></div>`;

  const linha=`<div class="eyebrow">Quando cada meta é alcançada</div>
    <div class="card"><div class="card-h"><div><div class="ct">Linha do tempo</div><div class="cs">no ritmo atual de ${fmt(F.sobra)}/mês, seguindo a ordem de prioridade</div></div></div>
      <div class="legend"><span><span class="sw" style="background:${cssv("--card2")};border:1px solid ${cssv("--border-strong")}"></span> caminho até a meta</span><span><span class="sw" style="background:${cssv("--brand")}"></span> tempo até ser alcançada</span></div>
      ${timelineSvg(plano)}
      <div class="cap">A barra colorida mostra <b>quanto tempo</b> falta para cada meta. A sobra vai primeiro para a meta de maior prioridade; quando ela é concluída, o valor passa para a seguinte.</div></div>`;

  const cards=metas.map((m,i)=>{
    const p=m.alvo>0?Math.min(100,Math.round(m.atual/m.alvo*100)):0;
    const falta=Math.max(0,m.alvo-m.atual), pl=plano[i];
    const mesesPrazo = m.dataAlvo ? (()=>{ const n=new Date(),dt=new Date(m.dataAlvo+"T00:00:00");
      return Math.max(1,(dt.getFullYear()-n.getFullYear())*12+(dt.getMonth()-n.getMonth())); })() : null;
    const porMes = mesesPrazo ? falta/mesesPrazo : null;
    /* Viabilidade real: compara a PREVISÃO (sobra dividida por prioridade) com o prazo desejado.
       Comparar só com a sobra cheia enganaria — as metas disputam o mesmo dinheiro. */
    let via;
    if(mesesPrazo==null) via=`<span class="badge n">sem prazo definido</span>`;
    else if(pl.mes===null) via=`<span class="badge r">não alcançável no ritmo atual</span>`;
    else if(pl.mes<=mesesPrazo) via=`<span class="badge g">✓ chega no prazo</span>`;
    else via=`<span class="badge y">atrasa ${pl.mes-mesesPrazo} ${pl.mes-mesesPrazo===1?"mês":"meses"}</span>`;
    const mx=Math.max(porMes||0,F.sobra)||1;
    const cmp = porMes!=null ? `
      <div class="cmp"><div class="cmp-t">Esforço mensal para cumprir o prazo — se esta fosse a única meta</div>
        <div class="cmp-row"><span class="cr-l">Precisa guardar</span><div class="cr-bar"><div class="cr-f" style="width:${(porMes/mx*100).toFixed(1)}%;background:${m.cor}"></div></div><span class="cr-v" style="color:${m.cor}">${fmt(porMes)}</span></div>
        <div class="cmp-row"><span class="cr-l">Sua sobra hoje</span><div class="cr-bar"><div class="cr-f" style="width:${(F.sobra/mx*100).toFixed(1)}%;background:${cssv("--slate")}"></div></div><span class="cr-v">${fmt(F.sobra)}</span></div>
      </div>` : "";
    return `<div class="goal-full">
      <div class="gf-top">
        <div class="ring-wrap" style="width:84px;height:84px">${ringSvg(p,m.cor,8)}<div class="ring-pct" style="color:${m.cor};font-size:18px">${p}%</div></div>
        <div class="gf-body">
          <div class="gf-name"><span class="ic" style="color:${m.cor}">${svgIcon(m.ic)}</span>${esc(m.nome)} ${via}</div>
          <div class="gf-vals">Já guardado: <b>${fmt(m.atual)}</b> de ${fmt(m.alvo)} · faltam <b>${fmt(falta)}</b></div>
          <div class="track"><div class="fill" style="width:${p}%;background:${m.cor}"></div></div>
        </div>
      </div>
      ${cmp}
      <div class="gf-grid">
        <div class="mini"><div class="m-l">Prazo desejado</div><div class="m-v">${m.dataAlvo?mesAno(m.dataAlvo):"—"}</div></div>
        <div class="mini"><div class="m-l">Guardar por mês</div><div class="m-v">${porMes!=null?fmt(porMes):"—"}</div></div>
        <div class="mini"><div class="m-l">Previsão no ritmo atual</div><div class="m-v" style="color:${pl.mes!==null?m.cor:"var(--muted)"}">${pl.mes!==null?labelMes(pl.mes):"+10 anos"}</div></div>
        <div class="mini"><div class="m-l">Prioridade</div><div class="m-v">${i+1}º</div></div>
      </div></div>`;
  }).join("");

  box.innerHTML = resumo + linha + `<div class="eyebrow">Detalhe de cada meta</div>` + cards +
    `<div class="note"><b>Guardar por mês</b> é o quanto seria necessário para cumprir o prazo desejado. <b>Previsão no ritmo atual</b> considera que a sobra é dividida seguindo a ordem de prioridade das metas.</div>`;
}

function aplicarCenario(v,origem){
  extraPoupanca=Math.max(0,Number(v)||0);
  const r=document.getElementById("simRange"), n=document.getElementById("simInput");
  if(r && origem!=="range") r.value=Math.min(2000,extraPoupanca);
  if(n && origem!=="input") n.value=extraPoupanca;
  const proj=projetar(24,extraPoupanca), fim=proj[24].saldo, base=projetar(24,0)[24].saldo;
  document.getElementById("simChart").innerHTML=saldoSvg(proj);
  document.getElementById("simFim").textContent=fmt(fim);
  document.getElementById("simSaldo").textContent=fmt(fim);
  document.getElementById("simDelta").textContent="+ "+fmt(fim-base);
  document.getElementById("simSobra").textContent=fmt(F.sobra+extraPoupanca);
  document.getElementById("simCap").textContent=`Guardando ${fmt(F.sobra+extraPoupanca)} por mês, em 2 anos seu saldo acumulado chega a cerca de ${fmt(fim)}.`;
  document.getElementById("simMetas").innerHTML=metasCenarioHTML();
}

/* ================= PÁGINA: INVESTIR ================= */
const PERFIL_INV={
  conservador:{l:"Conservador",d:"Prioriza segurança e liquidez. Aceita render menos para não correr risco de perder."},
  moderado:{l:"Moderado",d:"Aceita alguma oscilação em parte do dinheiro em troca de um retorno maior no longo prazo."},
  arrojado:{l:"Arrojado",d:"Tolera oscilações relevantes buscando retorno maior, com horizonte de longo prazo."},
};
function perfilInvestidor(){
  const p=perfilData||{};
  if(p.perfil_investidor) return {chave:p.perfil_investidor, declarado:true};
  const ci=Number(p.conforto_investimentos)||0;
  return { chave: ci>=4?"arrojado":(ci>=3?"moderado":"conservador"), declarado:false };
}
function renderInvestir(){
  const p=perfilData||{};
  const pi=perfilInvestidor(), inf=PERFIL_INV[pi.chave]||PERFIL_INV.conservador;

  /* --- cartão de identidade / perfil --- */
  const tags=[`Perfil ${inf.l.toLowerCase()}`];
  if(idade(p.data_nascimento)!=null) tags.push(idade(p.data_nascimento)+" anos");
  if(p.tipo_renda) tags.push(esc(p.tipo_renda));
  const idCard=`<div class="id-card"><div class="id-av">${F.inicial}</div>
    <div class="id-info"><div class="id-name">${esc(p.nome_completo||F.nome)}</div>
      <div class="id-sub">${inf.d}</div>
      <div class="id-tags">${tags.map(t=>`<span class="id-tag">${t}</span>`).join("")}</div></div></div>
    ${pi.declarado?"":`<div class="note">Perfil sugerido a partir do seu questionário. Seu consultor pode ajustar.</div>`}`;

  /* --- onde está o dinheiro --- */
  let alocacao="";
  if(apsData.length){
    const porClasse={};
    apsData.forEach(a=>{ const k=a.classe||"outro"; porClasse[k]=(porClasse[k]||0)+num(a.valor_atual); });
    const itens=Object.entries(porClasse).map(([k,v])=>({chave:k,nome:(CLASSES[k]||CLASSES.outro).l,valor:v,cor:cssv((CLASSES[k]||CLASSES.outro).cor)})).sort((a,b)=>b.valor-a.valor);
    const tot=itens.reduce((s,i)=>s+i.valor,0);
    const reservaV=apsData.filter(a=>a.eh_reserva).reduce((s,a)=>s+num(a.valor_atual),0);
    const legH=itens.map(it=>`<div class="dleg-row"><span class="sw" style="background:${it.cor}"></span><span class="dl-n">${esc(it.nome)}</span><span class="dl-v">${fmt(it.valor)}</span><span class="dl-p">${Math.round(it.valor/(tot||1)*100)}%</span></div>`).join("");
    alocacao=`<div class="eyebrow">Onde está seu dinheiro</div>
      <div class="card"><div class="donut-row">
        <div class="donut-box">${donutSvg(itens)}<div class="donut-center"><div class="dc-v">${fmt(tot)}</div><div class="dc-l">total investido</div></div></div>
        <div class="dleg">${legH}</div></div>
        <div class="grid2" style="margin-top:15px">
          <div class="mini"><div class="m-l">Reserva de emergência</div><div class="m-v" style="color:${cssv("--teal")}">${fmt(reservaV)}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:2px">ideal: ${fmt(F.reservaIdeal)} (${F.mesesIdeal} meses)</div></div>
          <div class="mini"><div class="m-l">Para crescer</div><div class="m-v" style="color:${cssv("--green")}">${fmt(tot-reservaV)}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:2px">${tot>0?Math.round((tot-reservaV)/tot*100):0}% da carteira</div></div>
          <div class="mini"><div class="m-l">Classes diferentes</div><div class="m-v">${itens.length}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:2px">${itens.length>=3?"boa diversificação":"pouca diversificação"}</div></div>
        </div></div>`;
  }

  /* --- lista detalhada + formulário --- */
  const grupos={};
  apsData.forEach(a=>{ const k=a.classe||"outro"; (grupos[k]=grupos[k]||[]).push(a); });
  const listaH=Object.keys(grupos).length ? Object.entries(grupos).map(([k,arr])=>{
    const c=CLASSES[k]||CLASSES.outro, cor=cssv(c.cor);
    const sub=arr.reduce((s,a)=>s+num(a.valor_atual),0);
    return `<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <span class="sw" style="background:${cor}"></span><b style="font-size:13.5px">${c.l}</b>
        <span style="margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums">${fmt(sub)}</span></div>
      ${arr.map(a=>`<div class="ap-row">
        <div class="ap-ic" style="background:color-mix(in srgb, ${cor} 15%, transparent);color:${cor}">${svgIcon(c.ic)}</div>
        <div class="ap-b"><div class="ap-n">${esc(a.descricao||c.l)}${a.eh_reserva?' <span class="badge b" style="font-size:9.5px">reserva</span>':""}</div>
          <div class="ap-s">${esc(a.instituicao||"")}${a.instituicao&&a.rentabilidade_ref?" · ":""}${esc(a.rentabilidade_ref||"")}</div></div>
        <div class="ap-v">${fmt(num(a.valor_atual))}</div>
        ${isHost?`<button class="ap-del" onclick="removerAplicacao('${a.id}')" title="Remover">×</button>`:""}
      </div>`).join("")}</div>`;
  }).join("") : `<div class="empty">Nenhuma aplicação cadastrada ainda.${isHost?" Use o formulário abaixo para adicionar.":" Fale com seu consultor."}</div>`;

  const form = isHost ? `
    <form class="ap-form" onsubmit="adicionarAplicacao(event)">
      <div><label>Classe</label><select id="apClasse">${Object.entries(CLASSES).map(([k,v])=>`<option value="${k}">${v.l}</option>`).join("")}</select></div>
      <div><label>Descrição</label><input id="apDesc" placeholder="Tesouro Selic"></div>
      <div><label>Onde está</label><input id="apInst" placeholder="Banco / corretora"></div>
      <div><label>Rentabilidade</label><input id="apRent" placeholder="100% do CDI"></div>
      <div><label>Valor</label><input id="apValor" type="number" step="0.01" min="0" placeholder="0,00" required></div>
      <label class="chk"><input type="checkbox" id="apReserva"> é reserva</label>
      <button class="btn-p" type="submit">Adicionar</button>
    </form><div id="apMsg" class="note"></div>` : "";

  /* --- projeção de rendimento --- */
  const i=taxaMensal(), n=24;
  const p0=F.investido||F.reserva, pmt=F.sobra;
  const s24=projetarAplicado(n), parado=s24.A, aplicado=s24.B;
  const marcos=marcosHTML();
  const rend=`<div class="eyebrow">Quanto sua sobra pode render</div>
    <div class="card">
      <div class="card-h"><div><div class="ct">Guardar parado × aplicado</div><div class="cs">a partir de ${fmt(p0)}, aportando sua sobra (${fmt(pmt)}/mês hoje, e mais quando parcelas terminarem)</div></div>
        <div class="c-end"><div class="lbl">em 2 anos, aplicado</div><div class="val">${fmt(aplicado[n])}</div></div></div>
      <div class="legend"><span><span class="ln" style="background:repeating-linear-gradient(90deg,${cssv("--slate")} 0 4px,transparent 4px 9px)"></span> Parado (sem render)</span><span><span class="ln" style="background:${cssv("--green")}"></span> Aplicado</span></div>
      ${duasLinhasSvg(parado,aplicado,cssv("--slate"),cssv("--green"))}
      <div class="prem" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
        <div><label>CDI ao ano (premissa)</label><input class="num-in" style="width:100%" id="cdiIn" type="number" step="0.1" value="${(F.cdi*100).toFixed(2)}" ${isHost?"":"disabled"} oninput="atualizarPremissa()"></div>
        <div><label>Rende quanto do CDI</label><input class="num-in" style="width:100%" id="pctIn" type="number" step="1" value="${(F.pctCdi*100).toFixed(0)}" ${isHost?"":"disabled"} oninput="atualizarPremissa()"></div>
        <div><label>Taxa equivalente ao mês</label><div class="num-in" style="width:100%;display:flex;align-items:center;justify-content:flex-end;background:var(--card)" id="taxaMes">${pct1(i)}</div></div>
      </div>
      ${isHost?`<div class="note" id="premMsg">Você pode ajustar a premissa. <button class="btn-p" style="height:32px;font-size:12.5px;margin-left:6px" onclick="salvarPremissas()">Salvar</button></div>`:""}
      <div class="tbl-wrap"><table>
        <thead><tr><th>Prazo</th><th>Parado</th><th>Aplicado</th><th>Já com IR</th><th>Ganho real</th></tr></thead>
        <tbody id="marcosBody">${marcos}</tbody></table></div>
      <div class="disclaimer"><b>Importante:</b> esta é uma <b>simulação educativa</b> para ajudar no planejamento — não é recomendação de investimento nem promessa de retorno.
        A coluna <b>"Já com IR"</b> desconta o imposto de renda regressivo da renda fixa (22,5% até 6 meses, caindo a 15% acima de 2 anos), cobrado só sobre o ganho; poupança é isenta e ações seguem outra regra.
        Os valores são <b>nominais</b> — não descontam a inflação, então o poder de compra futuro é menor do que o número mostra.</div>
    </div>`;

  const dados=[
    {ic:"user",l:"Nome completo",v:p.nome_completo||p.nome},
    {ic:"mail",l:"E-mail",v:p.email},
    {ic:"phone",l:"Telefone",v:p.telefone},
    {ic:"cake",l:"Nascimento",v:dataBR(p.data_nascimento)},
    {ic:"heart",l:"Estado civil",v:p.estado_civil},
    {ic:"users",l:"Dependentes",v:p.dependentes!=null?String(p.dependentes):null},
    {ic:"brief",l:"Tipo de renda",v:p.tipo_renda},
  ].map(d=>`<div class="info-c"><div class="ic-b">${svgIcon(d.ic)}</div><div style="min-width:0"><div class="i-l">${d.l}</div><div class="i-v">${d.v?esc(d.v):ND}</div></div></div>`).join("");

  document.getElementById("pageContent").innerHTML =
    idCard + alocacao +
    `<div class="eyebrow">Suas aplicações</div><div class="card">${listaH}${form}</div>` +
    rend +
    `<details><summary>Meus dados cadastrais</summary><div class="info-grid">${dados}</div>
      <div class="note">Para atualizar estes dados, fale com seu consultor.</div></details>`;
}
function marcosHTML(){
  const s=projetarAplicado(120);
  return [12,24,60,120].map(m=>{
    const a=s.A[m], b=s.B[m], liq=b-(b-a)*aliquotaIR(m);
    return `<tr><td>${m/12} ano${m>12?"s":""}</td><td>${fmt(a)}</td><td class="pos"><b>${fmt(b)}</b></td><td>${fmt(liq)}</td><td class="pos">${fmt(liq-a)}</td></tr>`;
  }).join("");
}
function atualizarPremissa(){
  const c=Number(document.getElementById("cdiIn").value)/100;
  const q=Number(document.getElementById("pctIn").value)/100;
  if(!isFinite(c)||!isFinite(q)) return;
  F.cdi=Math.max(0,c); F.pctCdi=Math.max(0,q);
  document.getElementById("taxaMes").textContent=pct1(taxaMensal());
  document.getElementById("marcosBody").innerHTML=marcosHTML();
}
async function salvarPremissas(){
  const msg=document.getElementById("premMsg");
  const { error }=await sb.from("perfis").update({cdi_anual:F.cdi, pct_cdi:F.pctCdi}).eq("id",perfilData.id);
  if(msg) msg.innerHTML = error ? `<span style="color:var(--rose)">Não consegui salvar: ${esc(error.message)}</span>` : `<span style="color:var(--green)">Premissa salva ✓</span>`;
  if(!error){ perfilData.cdi_anual=F.cdi; perfilData.pct_cdi=F.pctCdi; }
}
async function adicionarAplicacao(ev){
  ev.preventDefault();
  const msg=document.getElementById("apMsg");
  const reg={
    cliente_id: perfilData.cliente_id, perfil_id: perfilData.id,
    classe: document.getElementById("apClasse").value,
    descricao: document.getElementById("apDesc").value.trim()||null,
    instituicao: document.getElementById("apInst").value.trim()||null,
    rentabilidade_ref: document.getElementById("apRent").value.trim()||null,
    valor_atual: Number(document.getElementById("apValor").value)||0,
    eh_reserva: document.getElementById("apReserva").checked,
    atualizado_em: new Date().toISOString().slice(0,10),
  };
  const { error }=await sb.from("aplicacoes").insert(reg);
  if(error){ if(msg) msg.innerHTML=`<span style="color:var(--rose)">Não consegui adicionar: ${esc(error.message)}</span>`; return; }
  const { data }=await sb.from("aplicacoes").select("*");
  apsData=data||[]; recalcularInvestido(); renderInvestir();
}
async function removerAplicacao(id){
  const { error }=await sb.from("aplicacoes").delete().eq("id",id);
  if(error){ alert("Não consegui remover: "+error.message); return; }
  const { data }=await sb.from("aplicacoes").select("*");
  apsData=data||[]; recalcularInvestido(); renderInvestir();
}
function recalcularInvestido(){
  F.investido=apsData.reduce((s,a)=>s+num(a.valor_atual),0);
  const rv=apsData.filter(a=>a.eh_reserva).reduce((s,a)=>s+num(a.valor_atual),0);
  if(rv>0){ F.reserva=rv; F.mesesReserva=F.fixos>0?rv/F.fixos:0; }
}

/* ================= TEMA ================= */
document.getElementById("themeBtn").addEventListener("click",()=>{
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  document.getElementById("themeBtn").textContent=next==="dark"?"☀":"☾";
  try{ localStorage.setItem("tema",next); }catch(e){}
  if(F.renda!=null) setPage(currentPage);
});
try{ const t=localStorage.getItem("tema"); if(t){ document.documentElement.setAttribute("data-theme",t); document.getElementById("themeBtn").textContent=t==="dark"?"☀":"☾"; } }catch(e){}

/* ================= INÍCIO ================= */
renderNav();
(async function init(){
  try{ const {data:{session}}=await sb.auth.getSession(); if(session){ showApp(); loadData(); } else showLogin(); }
  catch(e){ showLogin(); }
})();
</script>
</body>
</html>
