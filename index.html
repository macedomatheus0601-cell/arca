<head>

<style>
  /* Paleta calibrada para contraste legível nos dois temas.
     Cores de dado (verde/âmbar/teal/rosa) foram escurecidas no claro e
     clareadas no escuro para ficarem legíveis como texto pequeno. */
  :root {
    --bg:#eef0f4; --bg2:#e7eaf0; --card:#ffffff; --card2:#f5f7fa;
    --ro-bg:#ebeef4;                      /* campo calculado (não editável) */
    --border:#e4e7ee; --border-strong:#d3d7e0;
    --text:#141821; --text2:#4f5764; --muted:#6b7280;
    --brand:#2560c8; --brand2:#1c4fa6;
    --green:#07734c; --green-bg:#e9f7f0;
    --amber:#8a5508; --amber-bg:#fcf2e0;
    --teal:#0a6b7e; --teal-bg:#e5f4f8;
    --rose:#b92f36; --rose-bg:#fce9ea;
    --slate:#5a6274; --slate-bg:#edeff4;
    --grad-hero:linear-gradient(140deg,#2f6bd6 0%,#163f8f 100%);
    --grad-foco:linear-gradient(135deg,#0f9276 0%,#0a8299 100%);
    --shadow:0 4px 18px rgba(30,40,70,.08); --shadow-lg:0 12px 34px rgba(30,40,70,.14);
  }
  :root[data-theme="dark"] {
    --bg:#0c0e13; --bg2:#101319; --card:#171a21; --card2:#1f242e;
    --ro-bg:#282e3a;
    --border:#272c37; --border-strong:#3a4150;
    --text:#f0f1f4; --text2:#b4bcc9; --muted:#8891a1;
    --brand:#6b98f7; --brand2:#4a79e0;
    --green:#3ed19a; --green-bg:#0f2b21;
    --amber:#e8ae4d; --amber-bg:#2e2411;
    --teal:#48c3d8; --teal-bg:#0d262c;
    --rose:#f0787e; --rose-bg:#2e161a;
    --slate:#9aa2b2; --slate-bg:#1f242e;
    --grad-hero:linear-gradient(140deg,#2a5cc0 0%,#143a80 100%);
    --grad-foco:linear-gradient(135deg,#0e8a6e 0%,#0a7f95 100%);
    --shadow:0 4px 18px rgba(0,0,0,.4); --shadow-lg:0 14px 36px rgba(0,0,0,.5);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
         font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .3s,color .3s; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; }
  input, select { font-family:inherit; }

  /* ---------- LOGIN ---------- */
  .login-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; z-index:100; background:radial-gradient(900px 500px at 50% -10%,var(--bg2),var(--bg)); overflow:auto; }
  .login-card { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:30px 26px; width:100%; max-width:380px; box-shadow:var(--shadow-lg); }
  .login-mark { width:54px; height:54px; border-radius:16px; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:var(--shadow); }
  .login-mark svg { width:28px; height:28px; }
  .login-card h1 { font-size:20px; font-weight:750; text-align:center; letter-spacing:-.3px; }
  .login-card .lsub { font-size:13px; color:var(--muted); text-align:center; margin:4px 0 22px; }
  .field { margin-bottom:13px; }
  .field label { font-size:12.5px; color:var(--text2); font-weight:600; display:block; margin-bottom:5px; }
  .field input { width:100%; height:46px; padding:0 14px; border-radius:12px; border:1px solid var(--border-strong); background:var(--card); color:var(--text); font-size:15px; outline:none; transition:border-color .15s; }
  .field input:focus { border-color:var(--brand); }
  .login-btn { width:100%; height:47px; border-radius:12px; background:var(--grad-hero); color:#fff; font-size:15px; font-weight:700; margin-top:8px; transition:transform .1s,opacity .2s; }
  .login-btn:active { transform:scale(.98); }
  .login-btn:disabled { opacity:.6; cursor:default; }
  .login-err, .login-ok { font-size:12.5px; font-weight:600; padding:9px 12px; border-radius:10px; margin-bottom:14px; display:none; }
  .login-err { background:var(--rose-bg); color:var(--rose); }
  .login-ok { background:var(--green-bg); color:var(--green); }
  .login-err.show, .login-ok.show { display:block; }
  .login-opts { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:2px 0 4px; }
  .chk-lembrar { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text2); cursor:pointer; }
  .chk-lembrar input { width:16px; height:16px; accent-color:var(--brand); cursor:pointer; }
  .link-btn { font-size:12.5px; color:var(--brand); font-weight:600; padding:0; }
  .link-btn:hover { text-decoration:underline; }

  /* ---------- SHELL ---------- */
  .shell { display:none; min-height:100vh; }
  .shell.show { display:grid; grid-template-columns:232px 1fr; transition:grid-template-columns .22s ease; }
  .shell.show.nav-hidden { grid-template-columns:0px 1fr; }
  .sidebar { background:var(--card); border-right:1px solid var(--border); padding:18px 14px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden; }
  .shell.nav-hidden .sidebar { padding-left:0; padding-right:0; border-right-color:transparent; }
  .shell.nav-hidden .sidebar > * { opacity:0; pointer-events:none; transition:opacity .12s; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; }
  .brand .mark { width:38px; height:38px; border-radius:11px; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand .mark svg { width:20px; height:20px; }
  .brand .bname { font-weight:750; font-size:15px; letter-spacing:-.3px; white-space:nowrap; }
  .brand .bsub { font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .nav { display:flex; flex-direction:column; gap:3px; flex:1; }
  .nav-item { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--text2); font-size:14px; font-weight:600; width:100%; text-align:left; white-space:nowrap; transition:background .15s,color .15s; }
  .nav-item svg { width:19px; height:19px; flex-shrink:0; }
  .nav-item:hover { background:var(--card2); color:var(--text); }
  .nav-item.active { background:color-mix(in srgb,var(--brand) 13%,transparent); color:var(--brand); }
  .side-foot { border-top:1px solid var(--border); padding-top:12px; margin-top:8px; display:flex; align-items:center; gap:10px; }
  .side-foot .u-name { font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-foot .u-role { font-size:10.5px; color:var(--muted); }
  .sair-btn { width:32px; height:32px; border-radius:9px; color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sair-btn svg { width:17px; height:17px; }
  .sair-btn:hover { background:var(--rose-bg); color:var(--rose); }

  .main { padding:22px 26px 60px; max-width:1420px; width:100%; }
  .main-top { display:flex; align-items:center; gap:11px; margin-bottom:18px; }
  .page-title { font-size:22px; font-weight:780; letter-spacing:-.4px; flex:1; min-width:0; }
  .top-btn { width:42px; height:42px; border-radius:12px; border:1px solid var(--border-strong); background:var(--card); color:var(--text2); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; transition:transform .1s,border-color .2s; }
  .top-btn:hover { border-color:var(--brand); color:var(--brand); }
  .top-btn:active { transform:scale(.92); }
  .top-btn svg { width:19px; height:19px; }
  .avatar { width:46px; height:46px; border-radius:14px; flex-shrink:0; background:var(--grad-hero); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; box-shadow:var(--shadow); }

  /* layout de duas colunas em telas largas (aproveita a lateral direita) */
  .cols { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; align-items:start; }
  @media (min-width:1150px){
    .cols { grid-template-columns:minmax(0,1fr) 312px; }
    /* coluna da direita fica parada na tela enquanto o conteúdo rola */
    .rail { position:sticky; top:18px; }
  }
  .rail { display:flex; flex-direction:column; gap:13px; }
  .rcard { background:var(--card); border:1px solid var(--border); border-radius:17px; padding:15px 16px; box-shadow:var(--shadow); }
  .rcard-h { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:730; margin-bottom:10px; }
  .rcard-h .rh-ic { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .rcard-h .rh-ic svg { width:14px; height:14px; }
  .rrow { display:flex; align-items:center; gap:9px; padding:7px 0; border-top:1px solid var(--border); font-size:12.5px; }
  .rrow:first-of-type { border-top:none; }
  .rrow .rr-n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
  .rrow .rr-v { font-weight:690; font-variant-numeric:tabular-nums; }
  .rday { width:26px; height:26px; border-radius:8px; background:var(--card2); color:var(--text2); font-size:11px; font-weight:730; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  @media (max-width:820px) {
    .shell.show, .shell.show.nav-hidden { grid-template-columns:1fr; }
    .sidebar { position:fixed; bottom:0; left:0; right:0; top:auto; height:auto; flex-direction:row; border-right:none; border-top:1px solid var(--border); padding:7px 8px !important; z-index:50; overflow:visible; box-shadow:0 -4px 18px rgba(0,0,0,.07); }
    .shell.nav-hidden .sidebar > * { opacity:1; pointer-events:auto; }
    .brand, .side-foot { display:none; }
    .nav { flex-direction:row; gap:2px; overflow-x:auto; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav-item { flex-direction:column; gap:3px; padding:7px 3px; font-size:9.5px; border-radius:10px; justify-content:center; min-width:60px; flex:1 0 auto; }
    .nav-item svg { width:21px; height:21px; }
    .cli-sel { max-width:140px; font-size:12.5px; }
    .main { padding:18px 15px 92px; }
    #menuBtn { display:none; }
  }

  .eyebrow { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:800; margin:24px 2px 12px; display:flex; align-items:center; gap:7px; }
  .eyebrow:first-child { margin-top:2px; }

  /* ---------- ajuda (?) ---------- */
  .help { width:21px; height:21px; border-radius:50%; border:1px solid var(--border-strong); color:var(--muted);
          font-size:11.5px; font-weight:800; line-height:1; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--card); }
  .help:hover { border-color:var(--brand); color:var(--brand); }
  .hero .help, .foco .help { border-color:rgba(255,255,255,.45); color:rgba(255,255,255,.9); background:rgba(255,255,255,.14); }
  .tip-pop { position:fixed; z-index:200; max-width:290px; background:var(--card); color:var(--text); border:1px solid var(--border-strong);
             border-radius:13px; padding:12px 14px; font-size:12.5px; line-height:1.55; box-shadow:var(--shadow-lg); display:none; }
  .tip-pop b { color:var(--brand); }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }

  /* ---------- HERO ---------- */
  .hero { background:var(--grad-hero); border-radius:22px; color:#fff; padding:22px; box-shadow:var(--shadow-lg); position:relative; overflow:hidden; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  .hero::after { content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.10); }
  .gauge-wrap { position:relative; width:168px; height:168px; flex-shrink:0; z-index:1; }
  .gauge-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gauge-score { font-size:46px; font-weight:800; line-height:1; letter-spacing:-1px; }
  .gauge-of { font-size:12px; opacity:.8; margin-top:3px; }
  .hero-info { flex:1; min-width:180px; z-index:1; }
  .hero-tag { font-size:11.5px; text-transform:uppercase; letter-spacing:1px; opacity:.82; font-weight:700; display:flex; align-items:center; gap:7px; }
  .hero-title { font-size:22px; font-weight:750; margin:5px 0 3px; letter-spacing:-.4px; }
  .hero-desc { font-size:13.5px; opacity:.9; line-height:1.5; margin-bottom:14px; }
  .pillars { display:flex; gap:8px; flex-wrap:wrap; }
  .pillar { background:rgba(255,255,255,.14); border-radius:12px; padding:8px 11px; flex:1; min-width:96px; }
  .pillar .p-lbl { font-size:10.5px; opacity:.82; display:flex; align-items:center; gap:5px; }
  .pillar .p-val { font-size:16px; font-weight:700; margin-top:3px; }
  .p-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }

  /* ---------- TILES ---------- */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:13px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); transition:transform .15s,box-shadow .15s; }
  .tile:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
  .chip { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; }
  .chip svg { width:20px; height:20px; }
  .chip.blue { background:color-mix(in srgb,var(--brand) 15%,transparent); color:var(--brand); }
  .chip.green { background:var(--green-bg); color:var(--green); }
  .chip.amber { background:var(--amber-bg); color:var(--amber); }
  .chip.teal { background:var(--teal-bg); color:var(--teal); }
  .chip.rose { background:var(--rose-bg); color:var(--rose); }
  .chip.slate { background:var(--slate-bg); color:var(--slate); }
  .t-label { font-size:12.5px; color:var(--text2); margin-top:12px; }
  .t-value { font-size:25px; font-weight:780; letter-spacing:-.6px; margin-top:3px; font-variant-numeric:tabular-nums; }
  .t-foot { display:flex; align-items:center; gap:6px; margin-top:7px; font-size:11.5px; font-weight:600; }
  .badge { padding:2px 8px; border-radius:20px; font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .badge.g { background:var(--green-bg); color:var(--green); }
  .badge.y { background:var(--amber-bg); color:var(--amber); }
  .badge.r { background:var(--rose-bg); color:var(--rose); }
  .badge.n { background:var(--slate-bg); color:var(--slate); }
  .badge.b { background:color-mix(in srgb,var(--brand) 14%,transparent); color:var(--brand); }
  .spark { margin-top:10px; }

  .foco { background:var(--grad-foco); color:#fff; border-radius:20px; padding:20px 22px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:16px; }
  .foco .f-ic { width:52px; height:52px; border-radius:15px; flex-shrink:0; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; }
  .foco .f-ic svg { width:26px; height:26px; }
  .foco .f-tag { font-size:11px; text-transform:uppercase; letter-spacing:.8px; opacity:.85; font-weight:700; display:flex; align-items:center; gap:7px; }
  .foco .f-title { font-size:18px; font-weight:750; margin:3px 0 4px; letter-spacing:-.3px; }
  .foco .f-desc { font-size:13px; opacity:.92; line-height:1.45; }

  .goals { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:13px; }
  .goal { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; box-shadow:var(--shadow); display:flex; gap:14px; align-items:center; }
  .ring-wrap { position:relative; flex-shrink:0; width:68px; height:68px; }
  .ring-pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:750; }
  .goal .g-body { flex:1; min-width:0; }
  .goal .g-name { font-size:15px; font-weight:720; display:flex; align-items:center; gap:7px; }
  .goal .g-name .mini-ic { width:15px; height:15px; }
  .goal .g-vals { font-size:12.5px; color:var(--text2); margin:5px 0 6px; font-variant-numeric:tabular-nums; }
  .goal .g-vals b { color:var(--text); }
  .goal .g-when { font-size:11px; color:var(--muted); display:inline-flex; align-items:center; gap:5px; background:var(--card2); padding:3px 9px; border-radius:20px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
  .card + .card { margin-top:13px; }
  .card-h { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .card-h .ct { font-size:15px; font-weight:730; display:flex; align-items:center; gap:7px; }
  .card-h .cs { font-size:12px; color:var(--muted); margin-top:1px; }
  .card-h .c-end { text-align:right; }
  .card-h .c-end .lbl { font-size:11px; color:var(--muted); }
  .card-h .c-end .val { font-size:20px; font-weight:780; color:var(--brand); letter-spacing:-.4px; font-variant-numeric:tabular-nums; }
  .legend { display:flex; gap:14px; font-size:11.5px; color:var(--text2); margin:4px 0 8px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .sw { width:11px; height:11px; border-radius:3px; display:inline-block; flex-shrink:0; }
  .ln { width:20px; height:3px; border-radius:2px; display:inline-block; background:var(--brand); }
  .ln.d { background:repeating-linear-gradient(90deg,var(--brand) 0 3px,transparent 3px 7px); }
  svg.chart { width:100%; height:auto; display:block; }
  .cap { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5; }
  .note { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .explica { background:color-mix(in srgb,var(--brand) 7%,transparent); border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);
             border-radius:13px; padding:12px 14px; font-size:12.5px; color:var(--text2); line-height:1.55; margin-bottom:13px; }
  .explica b { color:var(--text); }
  .disclaimer { background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:11px 13px; font-size:11.5px; color:var(--text2); line-height:1.55; margin-top:14px; }

  /* seletor de período */
  .segs { display:inline-flex; background:var(--card2); border-radius:11px; padding:3px; gap:2px; }
  .seg { padding:5px 12px; border-radius:9px; font-size:12px; font-weight:650; color:var(--text2); }
  /* tinta da marca em vez de "card": no tema escuro o card é mais ESCURO que a trilha,
     o que fazia o botão ativo parecer afundado em vez de destacado */
  .seg.active { background:color-mix(in srgb,var(--brand) 17%,transparent); color:var(--brand); font-weight:730; }

  /* gráfico com leitura no hover */
  .chart-host { position:relative; }
  .ctip { position:absolute; z-index:20; background:var(--card); border:1px solid var(--border-strong); border-radius:11px;
          padding:9px 11px; font-size:12px; box-shadow:var(--shadow-lg); pointer-events:none; display:none; min-width:120px; }
  .ctip .tt { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
  .ctip .tr { display:flex; align-items:center; gap:7px; margin-top:3px; white-space:nowrap; }

<script>

function help(texto){ return `<button class="help" type="button" data-tip="${esc(texto)}" aria-label="O que é isto?">?</button>`; }
function mostrarTip(el){
  tipPop.innerHTML=el.getAttribute("data-tip");
  tipPop.style.display="block";
  const r=el.getBoundingClientRect(), tw=tipPop.offsetWidth, th=tipPop.offsetHeight;
  let left=r.left+r.width/2-tw/2;
  left=Math.max(8, Math.min(window.innerWidth-tw-8, left));
  let top=r.bottom+8;
  if(top+th>window.innerHeight-8) top=Math.max(8, r.top-th-8);
  tipPop.style.left=left+"px"; tipPop.style.top=top+"px";
}
function esconderTip(){ tipPop.style.display="none"; }
document.addEventListener("mouseover", e=>{ const b=e.target.closest(".help"); if(b) mostrarTip(b); });
document.addEventListener("mouseout", e=>{ if(e.target.closest(".help")) esconderTip(); });
document.addEventListener("click", e=>{
  const b=e.target.closest(".help");
  if(b){ e.preventDefault(); tipPop.style.display==="block"&&tipPop.dataset.src===b.dataset.tip ? esconderTip() : (mostrarTip(b), tipPop.dataset.src=b.dataset.tip); }
  else esconderTip();
});

function montarEstado(){
  const perfil=perfilData;
  const renda=compsData.filter(c=>c.tipo==="receita").reduce((s,c)=>s+num(c.valor),0);
  const fixos=compsData.filter(c=>c.tipo==="despesa").reduce((s,c)=>s+num(c.valor),0);
  const parcelaDivida=compsData.filter(c=>c.tipo==="despesa"&&c.eh_divida).reduce((s,c)=>s+num(c.valor),0);
  const investido=apsData.reduce((s,a)=>s+num(a.valor_atual),0);
  const reservaAps=apsData.filter(a=>a.eh_reserva).reduce((s,a)=>s+num(a.valor_atual),0);
  const reserva = reservaAps>0 ? reservaAps : num(perfil.reserva_atual);
  const sobra = perfil.poupanca_mensal_atual!=null ? num(perfil.poupanca_mensal_atual) : (renda-fixos);
  const variaveis = Math.max(0, renda-fixos-sobra);
  const gastoMensal = fixos + variaveis;
  /* gasto ESSENCIAL: o que realmente não dá para cortar numa emergência.
     É a base correta da reserva — cobrir o supérfluo inflaria a meta sem necessidade. */
  const fixoEssencial = compsData.filter(c=>c.tipo==="despesa"&&c.essencial!==false).reduce((s,c)=>s+num(c.valor),0);
  const varEssencial = perfil.variavel_essencial!=null ? Math.min(num(perfil.variavel_essencial),variaveis) : variaveis;
  const gastoEssencial = Math.max(0, fixoEssencial + varEssencial) || gastoMensal;
  const rendaInstavel = /aut[oô]nomo|pj|empres|liberal|comiss/i.test(perfil.tipo_renda||"");
  const mesesIdeal = rendaInstavel ? 9 : 6;
  const saldoDividas = dividasData.reduce((s,d)=>s+num(d.saldo_devedor),0);
  const taxaMaxDivida = dividasData.reduce((m,d)=>Math.max(m,num(d.taxa_juros_mensal)),0);
  F={ nome:perfil.nome||"você", inicial:(perfil.iniciais||(perfil.nome||"?")[0]||"?").toUpperCase(),
      renda, fixos, reserva, investido, parcelaDivida, sobra, variaveis, gastoMensal, gastoEssencial, mesesIdeal, rendaInstavel,
      reservaIdeal: gastoEssencial*mesesIdeal, saldoDividas, taxaMaxDivida,
      taxa:renda>0?sobra/renda:0, mesesReserva:gastoEssencial>0?reserva/gastoEssencial:0, divida:renda>0?parcelaDivida/renda:0,
      cdi: perfil.cdi_anual!=null?num(perfil.cdi_anual):CDI_PADRAO,
      pctCdi: perfil.pct_cdi!=null?num(perfil.pct_cdi):PCT_CDI_PADRAO,
      inflacao: perfil.inflacao_anual!=null?num(perfil.inflacao_anual):INFLACAO_PADRAO };
  metas=objsData.map(o=>{ const st=GOAL_STYLE[o.tipo]||GOAL_STYLE.outro;
    return { nome:o.descricao||o.tipo, tipo:o.tipo, ic:st.ic, corVar:st.cor, cor:cssv(st.cor),
             atual:num(o.valor_atual), alvo:num(o.valor_alvo), dataAlvo:o.data_alvo,
             quando:o.data_alvo?"meta "+mesAno(o.data_alvo):"" }; });
  document.getElementById("sideAvatar").textContent=F.inicial;
  document.getElementById("sideName").textContent=F.nome;
  document.getElementById("sideRole").textContent=isHost?"consultor":"cliente";
}
function usarCache(motivo){
  const r=lerRetrato();
  if(!r) return false;
  perfilData=r.perfilData; compsData=r.compsData||[]; objsData=r.objsData||[]; apsData=r.apsData||[];
  dividasData=r.dividasData||[]; planosData=r.planosData||[]; catsData=r.catsData||[]; contasData=r.contasData||[];
  isHost=!!r.isHost; isConsultor=!!r.isConsultor; clientesLista=r.clientesLista||[]; clienteAtivo=r.clienteAtivo||null;
  offline=true; dadosDe=r.em?new Date(r.em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):null;
  montarEstado(); montarSeletorClientes(); barraOffline(); setPage(currentPage);
  return true;
}

  sel.style.display="";

}
document.getElementById("cliSel").addEventListener("change", e=>{
  clienteAtivo=e.target.value;
  try{ localStorage.setItem("clienteAtivo",clienteAtivo); }catch(err){}
  if(offline){ alert("Sem internet: não é possível trocar de cliente agora."); montarSeletorClientes(); return; }
  loadData();
});
async function loadData(attempt=1){
  const body=document.getElementById("pageContent");
  if(!sb){ if(!usarCache()) body.innerHTML=`<div class="state"><div class="big">⚠️</div>Não consegui carregar o sistema.<br><span style="font-size:12px">Conecte-se à internet e recarregue a página.</span></div>`; return; }
  if(!navigator.onLine){ if(usarCache()) return; }
  body.innerHTML=`<div class="state"><div class="big">⏳</div>Carregando seus dados...</div>`;
  try{
    /* 1) quem sou eu */
    const ur=await sb.from("usuarios").select("role,cliente_id").limit(1);
    const eu=(ur.data||[])[0]||{};
    isConsultor = eu.role==="consultor";
    isHost = eu.role==="host" || isConsultor;

    /* 2) consultor escolhe o cliente; cliente comum usa o próprio */
    if(isConsultor){
      const cl=await sb.from("clientes").select("id,nome,ativo").order("nome");
      clientesLista=(cl.data||[]).filter(c=>c.ativo!==false);
      let salvo=null; try{ salvo=localStorage.getItem("clienteAtivo"); }catch(e){}
      if(!clienteAtivo) clienteAtivo = (salvo && clientesLista.some(c=>c.id===salvo)) ? salvo : (clientesLista[0]||{}).id||null;
    } else { clientesLista=[]; clienteAtivo=eu.cliente_id||null; }
    montarSeletorClientes();
    if(isConsultor && !clienteAtivo){
      offline=false; perfilData=null;
      body.innerHTML=`<div class="state"><div class="big">👥</div>Nenhum cliente cadastrado ainda.<br>
        <button class="btn-p" style="margin-top:14px" onclick="setPage('clientes')">Cadastrar o primeiro cliente</button></div>`;
      renderNav(); return;
    }

    /* 3) dados do cliente ativo */
    const F_=q=>clienteAtivo?q.eq("cliente_id",clienteAtivo):q;
    const [pr,cr,or,ar,dr,plr,kr,ctr]=await Promise.all([
      F_(sb.from("perfis").select("*")).eq("ativo",true).limit(1),
      F_(sb.from("compromissos_recorrentes").select("*")).eq("ativo",true),
      F_(sb.from("objetivos").select("*")).eq("status","ativo").order("prioridade",{ascending:true}),
      F_(sb.from("aplicacoes").select("*")),
      F_(sb.from("dividas").select("*")).eq("status","ativa"),

    if(pr.error) throw pr.error; if(cr.error) throw cr.error; if(or.error) throw or.error;

/* ================= MOTOR DE CÁLCULO ================= */
function ativoNoMes(c,off){
  const hoje=new Date(), alvo=new Date(hoje.getFullYear(),hoje.getMonth()+off,1);
  if(c.data_fim){ if(new Date(c.data_fim+"T00:00:00")<alvo) return false; }
  else if(c.total_parcelas!=null&&c.parcela_atual!=null){
    if(off > Number(c.total_parcelas)-Number(c.parcela_atual)) return false;
  }
  if(c.data_inicio && new Date(c.data_inicio+"T00:00:00") > new Date(alvo.getFullYear(),alvo.getMonth()+1,0)) return false;
  return true;
}
const receitaMes = off => compsData.filter(c=>c.tipo==="receita"&&ativoNoMes(c,off)).reduce((s,c)=>s+num(c.valor),0);
const fixosMes   = off => compsData.filter(c=>c.tipo==="despesa"&&ativoNoMes(c,off)).reduce((s,c)=>s+num(c.valor),0);
function projetar(n=24, extra=0){
  const out=[]; let saldo=F.reserva;
  out.push({off:0,receita:receitaMes(0),fixos:fixosMes(0),variaveis:F.variaveis,despesa:fixosMes(0)+F.variaveis,sobra:F.sobra,saldo});
  for(let i=1;i<=n;i++){
    const rec=receitaMes(i), fx=fixosMes(i), desp=fx+F.variaveis, sob=rec-desp+extra;
    saldo+=sob; out.push({off:i,receita:rec,fixos:fx,variaveis:F.variaveis,despesa:desp,sobra:sob,saldo});
  }
  return out;
}
function planoAlocacao(extra=0, horizonte=120){
  const itens=metas.map(m=>({nome:m.nome,cor:m.cor,ic:m.ic,falta:Math.max(0,m.alvo-m.atual),mes:null}));
  const proj=projetar(horizonte,extra);
  for(let i=1;i<=horizonte;i++){
    let disp=proj[i]?proj[i].sobra:0;
    if(disp<=0) continue;
    for(const it of itens){
      if(it.mes!==null||it.falta<=0) continue;
      if(disp<=0) break;
      const usa=Math.min(disp,it.falta); it.falta-=usa; disp-=usa;
      if(it.falta<=0.01) it.mes=i;
    }
    if(itens.every(it=>it.mes!==null)) break;
  }
  return itens;
}
function calcScore(){
  const pPoup=Math.max(0,Math.min(1,F.taxa/0.20));
  let pDiv=Math.max(0,Math.min(1,1-F.divida/0.30));
  /* dívida cara pesa mais do que o tamanho da parcela: um rotativo pequeno já é grave */
  const dc=dividaCara();
  if(dc){ const ta=aoAno(num(dc.taxa_juros_mensal));
    pDiv=Math.min(pDiv, ta>=0.60?0.10 : ta>=0.30?0.30 : 0.55); }
  const pRes=Math.max(0,Math.min(1,F.mesesReserva/(F.mesesIdeal||6)));
  return { score:Math.round((pPoup*0.34+pDiv*0.30+pRes*0.36)*100), pPoup, pDiv, pRes };
}
/* ---- dívidas: taxa efetiva ao ano e custo de oportunidade ---- */
const aoAno = tm => Math.pow(1+tm,12)-1;
function dividasOrdenadas(){   /* mais cara primeiro — método "avalanche" */
  return dividasData.slice().sort((a,b)=>num(b.taxa_juros_mensal)-num(a.taxa_juros_mensal));
}
function dividaCara(){         /* dívida cujo juro supera o rendimento de um investimento seguro */
  const rend=F.cdi*F.pctCdi;
  return dividasOrdenadas().find(d=>num(d.taxa_juros_mensal)>0 && aoAno(num(d.taxa_juros_mensal))>rend) || null;
}
function economiaQuitando(d, meses=12){
  const tm=num(d.taxa_juros_mensal), s=num(d.saldo_devedor);
  if(!tm||!s) return 0;
  const jurosDivida = s*(Math.pow(1+tm,meses)-1);          /* o que a dívida cobraria */
  const rendApp = s*(Math.pow(1+taxaMensal(),meses)-1);    /* o que o mesmo dinheiro renderia */
  return jurosDivida-rendApp;                              /* ganho líquido de quitar */
}
function focoInfo(){
  const mi=F.mesesIdeal||6;
  const dc=dividaCara();
  if(dc) return {t:"Quitar a dívida mais cara",
    d:`A ${esc((dc.descricao||"sua dívida").toLowerCase())} cobra ${pct1(num(dc.taxa_juros_mensal))} ao mês (${pct1(aoAno(num(dc.taxa_juros_mensal)))} ao ano) — muito acima do que qualquer aplicação segura rende. Cada real usado para quitá-la vale mais do que investido.`};
  if(F.divida>=0.30) return {t:"Reduzir as dívidas",d:"Suas parcelas consomem uma fatia grande da renda. O primeiro passo é aliviar isso — é o que destrava o resto."};
  if(F.mesesReserva<mi/2) return {t:"Completar sua reserva de emergência",d:`Você tem hoje ${F.mesesReserva.toLocaleString("pt-BR",{maximumFractionDigits:1})} meses de custo de vida guardados. O primeiro passo é chegar a ${mi} meses (${fmt(F.reservaIdeal)})${F.rendaInstavel?", que é o recomendado para quem tem renda variável":""} — é o que traz segurança antes de mirar os outros objetivos.`};
  if(F.taxa<0.10) return {t:"Organizar e sobrar mais",d:"Sobra pouco no fim do mês. Vamos mapear os gastos e liberar mais espaço para as suas metas."};
  return {t:"Acelerar seus objetivos",d:"Sua base está saudável! Agora é hora de dar velocidade às suas metas e fazer o dinheiro render mais."};
}
const taxaMensal = () => Math.pow(1+F.cdi*F.pctCdi, 1/12)-1;
function projetarAplicado(n){
  const proj=projetar(n,0), i=taxaMensal();
  let parado=F.investido||F.reserva, aplic=parado;
  const A=[parado], B=[aplic];
  for(let k=1;k<=n;k++){ const s=Math.max(0,proj[k].sobra); parado+=s; aplic=aplic*(1+i)+s; A.push(parado); B.push(aplic); }
  return {A,B};
}
const aliquotaIR = meses => meses<=6 ? 0.225 : meses<=12 ? 0.20 : meses<=24 ? 0.175 : 0.15;
const faixaIR = meses => meses<=6 ? "até 180 dias" : meses<=12 ? "181 a 360 dias" : meses<=24 ? "361 a 720 dias" : "acima de 720 dias";

/* ================= LEITURA NO HOVER ================= */
function hoverChart(hostId, cfg){
  const host=document.getElementById(hostId); if(!host) return;
  const svg=host.querySelector("svg"); if(!svg) return;
  const tip=document.createElement("div"); tip.className="ctip"; host.appendChild(tip);
  const NS="http://www.w3.org/2000/svg";
  const guia=document.createElementNS(NS,"line");
  guia.setAttribute("stroke",cssv("--border-strong")); guia.setAttribute("stroke-width","1.3");
  guia.setAttribute("y1",cfg.y0); guia.setAttribute("y2",cfg.y1); guia.style.display="none";
  svg.appendChild(guia);
  const foco=document.createElementNS(NS,"circle");
  foco.setAttribute("r","5.5"); foco.setAttribute("fill",cfg.corFoco||cssv("--brand"));
  foco.setAttribute("stroke",cssv("--card")); foco.setAttribute("stroke-width","2.5"); foco.style.display="none";
  svg.appendChild(foco);
  function idx(ev){
    const r=svg.getBoundingClientRect();
    const cx=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX)-r.left;
    const vx=cx/(r.width/cfg.W);
    let best=0,bd=Infinity;
    cfg.xs.forEach((x,i)=>{ const d=Math.abs(x-vx); if(d<bd){bd=d;best=i;} });
    return best;
  }
  function mostrar(ev){
    const i=idx(ev), info=cfg.info(i); if(!info) return;
    tip.innerHTML=info;
    tip.style.display="block";
    const hr=host.getBoundingClientRect(), sr=svg.getBoundingClientRect(), k=sr.width/cfg.W;
    const px=(sr.left-hr.left)+cfg.xs[i]*k, tw=tip.offsetWidth;
    tip.style.left=Math.max(4, Math.min(hr.width-tw-4, px-tw/2))+"px";
    tip.style.top=(cfg.tipTop!=null?cfg.tipTop:6)+"px";
    guia.setAttribute("x1",cfg.xs[i]); guia.setAttribute("x2",cfg.xs[i]); guia.style.display="";
    if(cfg.ys){ foco.setAttribute("cx",cfg.xs[i]); foco.setAttribute("cy",cfg.ys[i]); foco.style.display=""; }
  }
  const sair=()=>{ tip.style.display="none"; guia.style.display="none"; foco.style.display="none"; };
  host.addEventListener("mousemove",mostrar);
  host.addEventListener("mouseleave",sair);
  host.addEventListener("touchstart",mostrar,{passive:true});
  host.addEventListener("touchmove",mostrar,{passive:true});
  host.addEventListener("touchend",sair);
}

/* fluxo: entradas acima, saídas abaixo, saldo em linha, com valores */

    <text x="${W-padR}" y="${H-5}" fill="${tick}" font-size="10" text-anchor="end" font-family="Segoe UI,sans-serif">a linha escura é o saldo do mês</text></svg>`;
  return { svg, W, xs, y0:padT, y1:H-padB,
    info:i=>`<div class="tt">${labelMesLongo(d[i].off)}</div>`+
      tipLinha(green,"Entrou",fmt(d[i].receita))+

function fluxoTabela(proj,n){
  const d=proj.slice(1,n+1);
  const tR=d.reduce((s,p)=>s+p.receita,0), tF=d.reduce((s,p)=>s+p.fixos,0),
        tV=d.reduce((s,p)=>s+p.variaveis,0), tS=d.reduce((s,p)=>s+p.sobra,0);
  const rows=d.map(p=>`<tr><td>${labelMes(p.off)}</td><td class="pos">${fmt(p.receita)}</td><td class="neg">${fmt(p.fixos)}</td><td class="neg">${fmt(p.variaveis)}</td><td class="${p.sobra>=0?"pos":"neg"}"><b>${fmt(p.sobra)}</b></td></tr>`).join("");
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Mês</th><th>Entrou</th><th>Saiu — fixas</th><th>Saiu — variáveis</th><th>Saldo</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>Total ${n} meses</td><td class="pos">${fmt(tR)}</td><td class="neg">${fmt(tF)}</td><td class="neg">${fmt(tV)}</td><td class="${tS>=0?"pos":"neg"}">${fmt(tS)}</td></tr></tfoot>
  </table></div>`;
}
function donutSvg(items){
  const total=items.reduce((s,i)=>s+i.valor,0)||1;
  const cx=100,cy=100,r=72,C=2*Math.PI*r;
  let acc=0,segs="";
  items.forEach(it=>{ const len=C*(it.valor/total), vis=Math.max(1,len-3);
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.cor}" stroke-width="27" stroke-dasharray="${vis.toFixed(1)} ${(C-vis).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=len; });
  return `<svg viewBox="0 0 200 200" style="width:100%;height:auto" role="img" aria-label="Composição">${segs}</svg>`;
}
function timelineSvg(plano){
  const ating=plano.filter(p=>p.mes!==null).map(p=>p.mes);
  const maxM=Math.max(6,...(ating.length?ating:[12]));
  /* calha à direita: a barra nunca chega à borda, então o rótulo do mês
     sempre cabe DEPOIS dela — inclusive na meta mais longa */
  const W=720,padL=12,padR=12,rowH=48,padT=36,labW=62;
  const H=padT+plano.length*rowH+8;
  const xMax=W-padR-labW;
  const x=m=>padL+(m/maxM)*(xMax-padL);
  const tick=cssv("--muted"),grid=cssv("--border"),text=cssv("--text"),card=cssv("--card"),cardm=cssv("--card2");
  const step = maxM<=6?1 : maxM<=12?2 : maxM<=24?4 : maxM<=48?6 : 12;
  let axis="";
  for(let m=0;m<=maxM;m+=step){ const px=x(m);
    axis+=`<line x1="${px.toFixed(1)}" y1="22" x2="${px.toFixed(1)}" y2="${H-4}" stroke="${grid}" stroke-width="1"/>`;
    axis+=`<text x="${px.toFixed(1)}" y="14" fill="${tick}" font-size="10.5" text-anchor="${txtAnchor(px,W,30)}" font-family="Segoe UI,sans-serif">${labelMes(m)}</text>`; }
  let rows="";
  plano.forEach((p,i)=>{
    const yy=padT+i*rowH+14, end=p.mes!==null?x(p.mes):xMax;
    rows+=`<text x="${padL+1}" y="${yy-5}" fill="${text}" font-size="11.5" font-weight="600" font-family="Segoe UI,sans-serif">${esc(p.nome)}</text>`;
    rows+=`<rect x="${padL}" y="${yy}" width="${(xMax-padL).toFixed(1)}" height="13" rx="6.5" fill="${cardm}"/>`;
    if(p.mes!==null){
      rows+=`<rect x="${padL}" y="${yy}" width="${Math.max(8,end-padL).toFixed(1)}" height="13" rx="6.5" fill="${p.cor}"/>`;
      rows+=`<circle cx="${end.toFixed(1)}" cy="${yy+6.5}" r="6.5" fill="${p.cor}" stroke="${card}" stroke-width="2.5"/>`;
      rows+=`<text x="${(end+12).toFixed(1)}" y="${yy+11}" fill="${tick}" font-size="10.5" text-anchor="start" font-family="Segoe UI,sans-serif">${labelMes(p.mes)}</text>`;
    }else{
      rows+=`<rect x="${padL}" y="${yy}" width="${(xMax-padL).toFixed(1)}" height="13" rx="6.5" fill="${p.cor}" opacity=".22"/>`;
      rows+=`<text x="${(xMax+12).toFixed(1)}" y="${yy+11}" fill="${tick}" font-size="10.5" text-anchor="start" font-family="Segoe UI,sans-serif">+10 anos</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Linha do tempo das metas">${axis}${rows}</svg>`;
}
function duasLinhasChart(a,b,corA,corB,nomeA,nomeB){
  const all=a.concat(b), W=760,H=270,padT=16,padB=28,padL=66,padR=14;
  const min=Math.min(...all),max=Math.max(...all),range=(max-min)||1;
  const x=i=>padL+i*(W-padL-padR)/(a.length-1), y=v=>padT+(max-v)/range*(H-padT-padB);
  const grid=cssv("--border"),tick=cssv("--muted");
  let g=`<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="${grid}" stroke-width="1"/>`;
  for(let k=0;k<=3;k++){ const gy=padT+k*(H-padT-padB)/3, gv=max-k*range/3;
    g+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="${grid}" stroke-width="1"/><text x="${(padL-8).toFixed(1)}" y="${(gy+4).toFixed(1)}" fill="${tick}" font-size="11" text-anchor="end" font-family="Segoe UI,sans-serif">${fmtK(gv)}</text>`; }
  const passo=a.length>18?6:3;
  let xl="";
  for(let i=0;i<a.length;i+=passo){ const px=x(i); xl+=`<text x="${px.toFixed(1)}" y="${H-8}" fill="${tick}" font-size="10.5" text-anchor="${px>W-40?"end":"middle"}" font-family="Segoe UI,sans-serif">${labelMes(i)}</text>`; }
  const pa=a.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const pb=b.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Comparação entre guardar parado e aplicado">
    ${g}${xl}
    <polyline points="${pa}" fill="none" stroke="${corA}" stroke-width="2.6" stroke-dasharray="4 5" stroke-linecap="round"/>
    <polyline points="${pb}" fill="none" stroke="${corB}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return { svg, W, xs:a.map((_,i)=>x(i)), ys:b.map(v=>y(v)), y0:padT, y1:H-padB, corFoco:corB,
    info:i=>`<div class="tt">${labelMesLongo(i)}</div>`+tipLinha(corA,nomeA,fmt(a[i]))+tipLinha(corB,nomeB,fmt(b[i]))+
      tipLinha(cssv("--amber"),"Diferença",fmt(b[i]-a[i])) };
}

  const form = isHost ? `

      <div style="flex:2"><label>Nova tarefa do mês</label><input id="paTitulo" placeholder="Ex.: Guardar R$ 500 na reserva" required></div>
      <div><label>Detalhe (opcional)</label><input id="paDetalhe" placeholder="Como fazer"></div>
      <button class="btn-p" type="submit" ${offline?"disabled":""}>Adicionar</button>
    </form><div id="paMsg" class="msg"></div>` : "";
  return `<div class="eyebrow">Plano de ação — ${labelMesLongo(0)} ${help("O que foi combinado no seu acompanhamento deste mês. Marque conforme for concluindo — assim vocês retomam a conversa sabendo exatamente o que avançou.")}</div>
    <div class="card"><div class="card-h"><div><div class="ct">Combinado para este mês</div>
      <div class="cs">${itens.length?feitos+" de "+itens.length+" concluído"+(itens.length>1?"s":""):"nada definido ainda"}</div></div>
      ${itens.length?`<div class="c-end"><div class="lbl">progresso</div><div class="val">${Math.round(feitos/itens.length*100)}%</div></div>`:""}</div>
      ${linhas}${form}</div>`;
}
async function alternarPlano(id){
  if(offline||!navigator.onLine){ alert("Sem internet: não é possível alterar agora."); return; }
  const p=planosData.find(x=>x.id===id); if(!p) return;
  const novo = p.status==="feito" ? "pendente" : "feito";
  const { error }=await sb.from("planos_acao").update({status:novo}).eq("id",id);
  if(error){ alert("Não consegui salvar: "+error.message); return; }
  p.status=novo; salvarRetrato(); setPage(currentPage);
}
async function adicionarPlano(ev){
  ev.preventDefault();
  if(bloqueadoOffline("paMsg")) return;
  const reg={ cliente_id:perfilData.cliente_id, perfil_id:perfilData.id, mes_referencia:mesAtualISO(),
    titulo:document.getElementById("paTitulo").value.trim(),
    detalhe:document.getElementById("paDetalhe").value.trim()||null,
    ordem:(planosData.length||0)+1 };
  if(!reg.titulo) return;
  const { data,error }=await sb.from("planos_acao").insert(reg).select();
  if(error){ const m=document.getElementById("paMsg"); if(m){ m.className="msg err"; m.textContent="Não consegui adicionar: "+error.message; } return; }
  planosData=planosData.concat(data||[]); salvarRetrato(); setPage(currentPage);
}
async function removerPlano(id){
  if(offline||!navigator.onLine){ alert("Sem internet: não é possível remover agora."); return; }
  const { error }=await sb.from("planos_acao").delete().eq("id",id);
  if(error){ alert("Não consegui remover: "+error.message); return; }
  planosData=planosData.filter(p=>p.id!==id); salvarRetrato(); setPage(currentPage);
}

/* ================= PÁGINA: DÍVIDAS ================= */
const TIPO_DIVIDA={
  cartao_rotativo:"Cartão (rotativo)", cheque_especial:"Cheque especial", emprestimo_pessoal:"Empréstimo pessoal",
  consignado:"Consignado", financiamento_veiculo:"Financiamento de veículo", financiamento_imovel:"Financiamento imobiliário",
  parcelamento:"Parcelamento", outro:"Outro",
};
function renderDividas(){
  const ds=dividasOrdenadas();
  if(!ds.length){ pagina(`<div class="state"><div class="big">🎉</div>Você não tem dívidas cadastradas.<br>Isso é uma ótima posição de partida.</div>`,""); return; }
  const total=ds.reduce((s,d)=>s+num(d.saldo_devedor),0);
  const parcelas=ds.reduce((s,d)=>s+num(d.parcela),0);
  const dc=dividaCara();
  const rendAno=F.cdi*F.pctCdi;

  const alerta = dc ? `<div class="alerta r"><div class="a-ic" style="background:color-mix(in srgb,${cssv("--rose")} 18%,transparent);color:${cssv("--rose")}">${svgIcon("alert")}</div>
      <div><b>Quitar esta dívida rende mais do que investir.</b><br>
      A ${esc((dc.descricao||TIPO_DIVIDA[dc.tipo]||"dívida").toLowerCase())} cobra <b>${pct1(num(dc.taxa_juros_mensal))} ao mês</b> (${pct1(aoAno(num(dc.taxa_juros_mensal)))} ao ano), enquanto uma aplicação segura rende cerca de ${pct1(rendAno)} ao ano.
      Adiantar o pagamento economiza cerca de <b>${fmt(economiaQuitando(dc,12))}</b> em 12 meses — um retorno garantido que nenhum investimento de baixo risco oferece.</div></div>`
    : `<div class="alerta g"><div class="a-ic" style="background:color-mix(in srgb,${cssv("--green")} 18%,transparent);color:${cssv("--green")}">${svgIcon("check")}</div>
      <div><b>Suas dívidas são baratas.</b><br>Nenhuma cobra juro acima do que uma aplicação segura rende (${pct1(rendAno)} ao ano). Antecipar o pagamento não traria ganho — vale mais manter o dinheiro rendendo e seguir pagando as parcelas normalmente.</div></div>`;

  const linhas=ds.map((d,i)=>{
    const tm=num(d.taxa_juros_mensal), ta=tm?aoAno(tm):null;
    const cara=tm>0 && ta>rendAno;
    const cor=cara?cssv("--rose"):cssv("--slate");
    return `<div class="div-row">
      <div class="ap-ic" style="background:color-mix(in srgb, ${cor} 15%, transparent);color:${cor}">${svgIcon("alert")}</div>
      <div class="div-b">
        <div class="div-n">${esc(d.descricao||TIPO_DIVIDA[d.tipo]||"Dívida")}
          ${i===0&&cara?'<span class="badge r">mais cara</span>':""}${!tm?'<span class="badge n">taxa não informada</span>':""}</div>
        <div class="div-s">${esc(TIPO_DIVIDA[d.tipo]||"")}${d.credor?" · "+esc(d.credor):""}${d.parcelas_restantes?" · faltam "+d.parcelas_restantes+"x":""}</div>
      </div>
      <div style="text-align:right"><div style="font-size:14px;font-weight:730;font-variant-numeric:tabular-nums">${fmt(num(d.saldo_devedor))}</div>
        <div style="font-size:11px;color:var(--muted)">${d.parcela?fmt(num(d.parcela))+"/mês":""}</div></div>
      <div class="div-taxa" style="color:${tm?cor:"var(--muted)"};min-width:88px">${tm?pct1(tm):"—"}<small>${ta!=null?pct1(ta)+" ao ano":"ao mês"}</small></div>
    </div>`;}).join("");

  /* ordem de ataque (método avalanche) */
  const ordem=ds.filter(d=>num(d.taxa_juros_mensal)>0).map((d,i)=>
    `<div class="rrow"><span class="rday">${i+1}º</span><span class="rr-n">${esc(d.descricao||TIPO_DIVIDA[d.tipo])}</span><span class="rr-v" style="color:${cssv("--rose")}">${pct1(num(d.taxa_juros_mensal))}</span></div>`).join("");

  const principal=`
    <div class="explica">Aqui estão suas dívidas ordenadas <b>da mais cara para a mais barata</b>. O que define a prioridade não é o tamanho, e sim a <b>taxa de juros</b>: uma dívida pequena de cartão pode custar mais que um financiamento grande.</div>
    ${alerta}
    <div class="eyebrow">Resumo</div>
    <div class="grid2">
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--rose")} 16%, transparent);color:${cssv("--rose")}">Σ</span>Saldo devedor total</div><div class="s-v">${fmt(total)}</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--amber")} 16%, transparent);color:${cssv("--amber")}">↓</span>Parcelas por mês</div><div class="s-v">${fmt(parcelas)}</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--brand")} 16%, transparent);color:${cssv("--brand")}">%</span>Da sua renda</div><div class="s-v">${Math.round(F.divida*100)}%</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--rose")} 16%, transparent);color:${cssv("--rose")}">!</span>Maior taxa</div><div class="s-v">${F.taxaMaxDivida?pct1(F.taxaMaxDivida):"—"}<span style="font-size:12px;color:var(--muted);font-weight:600"> a.m.</span></div></div>
    </div>
    <div class="eyebrow">Suas dívidas, da mais cara para a mais barata ${help("A ordem segue o método <b>avalanche</b>: pagar primeiro a de maior taxa é o que economiza mais dinheiro no total, mesmo que não seja a menor dívida.")}</div>
    <div class="card">${linhas}</div>
    <div class="note">A taxa ao ano considera juros compostos (juros sobre juros), por isso um valor mensal aparentemente pequeno vira um número alto no ano.</div>`;

  const lateral = (ordem?rcard("Ordem de ataque","target",cssv("--rose"),ordem+`<div class="cap" style="margin-top:8px">Pague o mínimo em todas e concentre o extra na primeira.</div>`):"")
    + railResumo();
  pagina(principal, lateral);
}

/* ================= PÁGINA: METAS ================= */
function renderMetas(){
  if(!metas.length){ pagina(`<div class="state"><div class="big">🎯</div>Nenhuma meta cadastrada ainda.<br>Fale com seu consultor para definir seus objetivos.</div>`,""); return; }
  const totAlvo=metas.reduce((s,m)=>s+m.alvo,0), totAtual=metas.reduce((s,m)=>s+m.atual,0);
  const pg=totAlvo>0?Math.round(totAtual/totAlvo*100):0;
  const plano=planoAlocacao(0);
  const concl=plano.filter(p=>p.mes!==null).length;

  const resumo=`<div class="card"><div class="donut-row">
      <div class="ring-wrap" style="width:104px;height:104px">${ringSvg(pg,cssv("--brand"),8)}<div class="ring-pct" style="color:${cssv("--brand")};font-size:20px">${pg}%</div></div>
      <div style="flex:1;min-width:200px">
        <div style="font-size:12.5px;color:var(--text2)">Progresso geral das metas</div>
        <div style="font-size:26px;font-weight:790;letter-spacing:-.6px;margin-top:2px">${fmt(totAtual)}</div>
        <div style="font-size:13px;color:var(--muted)">de ${fmt(totAlvo)} · faltam <b style="color:var(--text)">${fmt(Math.max(0,totAlvo-totAtual))}</b></div>
        <div class="track" style="margin-top:11px"><div class="fill" style="width:${pg}%;background:${cssv("--brand")}"></div></div>
      </div>
      <div style="min-width:148px">
        <div class="mini" style="margin-bottom:8px"><div class="m-l">Metas ativas</div><div class="m-v">${metas.length}</div></div>
        <div class="mini"><div class="m-l">Alcançáveis em 10 anos</div><div class="m-v">${concl} de ${metas.length}</div></div>
      </div></div></div>`;

  const linha=`<div class="eyebrow">Quando cada meta é alcançada</div>
    <div class="card"><div class="card-h"><div><div class="ct">Linha do tempo ${help(T.linhaTempo)}</div><div class="cs">no ritmo atual de ${fmt(F.sobra)}/mês, seguindo a ordem de prioridade</div></div></div>
      <div class="legend"><span><span class="sw" style="background:${cssv("--card2")};border:1px solid ${cssv("--border-strong")}"></span> caminho até a meta</span><span><span class="sw" style="background:${cssv("--brand")}"></span> tempo até ser alcançada</span></div>
      ${timelineSvg(plano)}</div>`;

  const cards=metas.map((m,i)=>{
    const p=m.alvo>0?Math.min(100,Math.round(m.atual/m.alvo*100)):0;
    const falta=Math.max(0,m.alvo-m.atual), pl=plano[i];
    const mesesPrazo = m.dataAlvo ? (()=>{ const n=new Date(),dt=new Date(m.dataAlvo+"T00:00:00");
      return Math.max(1,(dt.getFullYear()-n.getFullYear())*12+(dt.getMonth()-n.getMonth())); })() : null;
    const porMes = mesesPrazo ? falta/mesesPrazo : null;
    let via;
    if(mesesPrazo==null) via=`<span class="badge n">sem prazo definido</span>`;
    else if(pl.mes===null) via=`<span class="badge r">não alcançável no ritmo atual</span>`;
    else if(pl.mes<=mesesPrazo) via=`<span class="badge g">✓ chega no prazo</span>`;
    else via=`<span class="badge y">atrasa ${pl.mes-mesesPrazo} ${pl.mes-mesesPrazo===1?"mês":"meses"}</span>`;
    return `<div class="goal-full">
      <div class="gf-top">
        <div class="ring-wrap" style="width:84px;height:84px">${ringSvg(p,m.cor,8)}<div class="ring-pct" style="color:${m.cor};font-size:18px">${p}%</div></div>
        <div class="gf-body">
          <div class="gf-name"><span class="ic" style="color:${m.cor}">${svgIcon(m.ic)}</span>${esc(m.nome)} ${via}</div>
          <div class="gf-vals">Já guardado: <b>${fmt(m.atual)}</b> de ${fmt(m.alvo)} · faltam <b>${fmt(falta)}</b></div>
          <div class="track"><div class="fill" style="width:${p}%;background:${m.cor}"></div></div>
        </div>
      </div>
      <div class="gf-grid">
        <div class="mini"><div class="m-l">Prazo desejado</div><div class="m-v">${m.dataAlvo?mesAno(m.dataAlvo):"—"}</div></div>
        <div class="mini"><div class="m-l">Guardar por mês</div><div class="m-v">${porMes!=null?fmt(porMes):"—"}</div></div>
        <div class="mini"><div class="m-l">Previsão no ritmo atual</div><div class="m-v" style="color:${pl.mes!==null?m.cor:"var(--muted)"}">${pl.mes!==null?labelMes(pl.mes):"+10 anos"}</div></div>
        ${mesesPrazo>=24 ? `<div class="mini"><div class="m-l">Custo corrigido ${help("Preços sobem com o tempo. Este é o valor que a meta provavelmente custará na data desejada, corrigido por uma inflação de "+pct1(F.inflacao)+" ao ano — é a quantia que realmente compra o que você quer.")}</div>
             <div class="m-v" style="color:${cssv("--amber")}">${fmt(m.alvo*Math.pow(1+F.inflacao,mesesPrazo/12))}</div>
             <div style="font-size:10.5px;color:var(--muted);margin-top:2px">em ${mesAno(m.dataAlvo)}</div></div>`
          : `<div class="mini"><div class="m-l">Prioridade</div><div class="m-v">${i+1}º</div></div>`}
      </div></div>`;
  }).join("");

  const principal=`<div class="explica">Aqui você acompanha <b>cada objetivo</b>: o quanto já foi guardado, o quanto falta e quando ele deve ser alcançado. A sobra do mês é destinada às metas <b>em ordem de prioridade</b> — por isso a segunda meta só acelera depois que a primeira é concluída.</div>`
    + resumo + linha + `<div class="eyebrow">Detalhe de cada meta</div>` + cards;
  const lateral = rcard("Ordem de prioridade","target",cssv("--brand"),
      metas.map((m,i)=>`<div class="rrow"><span class="rday">${i+1}º</span><span class="rr-n">${esc(m.nome)}</span><span class="rr-v" style="color:${m.cor}">${plano[i].mes!==null?labelMes(plano[i].mes):"+10a"}</span></div>`).join("")
      +`<div class="cap" style="margin-top:8px">Data prevista no ritmo atual.</div>`)
    + railResumo();
  pagina(principal, lateral);
}

function setPeriodo(qual,v){ if(qual==="saldo") periodoSaldo=v; else periodoFluxo=v; renderProjecao(); }

    {l:"Renda mensal",v:fmt(F.renda),s:"+",cor:cssv("--green")},
    {l:"Gastos fixos",v:fmt(F.fixos),s:"−",cor:cssv("--rose")},
    {l:"Variáveis estimados",v:fmt(F.variaveis),s:"−",cor:cssv("--amber")},

  if(outros>0) itens.push({nome:"Outros fixos",valor:outros});
  itens.sort((a,b)=>b.valor-a.valor);

      <div class="legend"><span><span class="ln d"></span> Saldo projetado</span><span style="color:var(--muted)">passe o mouse para ver mês e valor</span></div>
      <div class="chart-host" id="hSaldo">${chS.svg}</div>
      <div class="cap" id="simCap">Guardando ${fmt(F.sobra+extraPoupanca)} por mês, em ${periodoSaldo} meses seu saldo acumulado chega a cerca de ${fmt(fim)}.</div></div>

    <div class="card">
      <div class="sim">
        <span style="font-size:13px;color:var(--text2)">Guardar a mais por mês</span>
        <input type="range" id="simRange" min="0" max="2000" step="50" value="${Math.min(2000,extraPoupanca)}" oninput="aplicarCenario(this.value,'range')">

function normalizarDesc(s){
  return String(s||"").toUpperCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/\d{2}[\/.-]\d{2}([\/.-]\d{2,4})?/g," ")
    .replace(/\b\d{4,}\b/g," ").replace(/[^A-Z0-9 ]/g," ")
    .replace(/\s+/g," ").trim().slice(0,60);
}
function hashLanc(data,desc,valor,contaId){
  const s=`${data}|${normalizarDesc(desc)}|${Number(valor).toFixed(2)}|${contaId}`;
  let h1=0x811c9dc5,h2=0x01000193;
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i);
    h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2+c^(h2>>>7),2246822519)>>>0; }
  return (h1>>>0).toString(16).padStart(8,"0")+(h2>>>0).toString(16).padStart(8,"0");
}
function parseValorBR(t){
  let s=String(t).replace(/[R$\s]/g,"");
  const neg=/^-/.test(s)||/\)$/.test(s);
  s=s.replace(/[()-]/g,"");
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  const v=parseFloat(s);
  return isNaN(v)?null:(neg?-v:v);
}
function parseDataBR(d,m,a){
  const ano = a ? (a.length===2 ? 2000+Number(a) : Number(a)) : new Date().getFullYear();
  const mm=Number(m), dd=Number(d);
  if(mm<1||mm>12||dd<1||dd>31) return null;
  return `${ano}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
}
/* extrai linhas de texto de um PDF preservando a ordem visual */
async function textoDoPDF(file){
  if(!window.pdfjsLib) throw new Error("Leitor de PDF não carregou. Recarregue a página.");
  pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const linhas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const porY={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (porY[y]=porY[y]||[]).push({x:it.transform[4], s:it.str});
    });
    Object.keys(porY).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const txt=porY[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
      if(txt) linhas.push(txt);
    });
  }
  return linhas;
}
function linhasDoCSV(txt){
  const sep = (txt.match(/;/g)||[]).length > (txt.match(/,/g)||[]).length ? ";" : ",";
  return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).join("  "));
}

function extrairLancamentos(linhas, colValor, sinalModo){
  const out=[], reData=/(\d{2})[\/.\-](\d{2})(?:[\/.\-](\d{2,4}))?/;
  const reVal=/-?\(?\s*R?\$?\s*\d{1,3}(?:\.\d{3})*,\d{2}\s*\)?[-]?/g;
  linhas.forEach(l=>{
    const md=l.match(reData); if(!md) return;
    const data=parseDataBR(md[1],md[2],md[3]); if(!data) return;
    const vals=l.match(reVal); if(!vals||!vals.length) return;
    let bruto;
    if(colValor==="ultimo") bruto=vals[vals.length-1];
    else if(colValor==="penultimo") bruto=vals.length>1?vals[vals.length-2]:vals[0];
    else bruto=vals[0];
    let v=parseValorBR(bruto); if(v==null||v===0) return;
    const semData=l.replace(md[0],"");
    let desc=semData;
    vals.forEach(x=>{ desc=desc.replace(x,""); });
    desc=desc.replace(/\s+/g," ").replace(/^[\s\-|]+|[\s\-|]+$/g,"").slice(0,120);
    if(!desc||desc.length<2) desc="(sem descrição)";
    /* sinal: D/C do extrato, ou tudo negativo salvo entradas óbvias */
    const marca=(l.match(/\b([CD])\b\s*$/)||[])[1];
    if(sinalModo==="dc" && marca) v=marca==="D"?-Math.abs(v):Math.abs(v);
    else if(sinalModo==="negativo") v=-Math.abs(v);
    else if(sinalModo==="positivo") v=Math.abs(v);
    else if(!/^-/.test(bruto.trim()) && !marca && /credito|deposito|salario|rendimento|estorno|pix recebid|ted recebid|transferencia recebid/i.test(normalizarDesc(desc))) v=Math.abs(v);
    else if(!/^-/.test(bruto.trim()) && !marca) v=-Math.abs(v);
    out.push({data, desc, valor:v});
  });
  return out;
}
/* classificação determinística: regras salvas + cruzamento com gastos fixos */
function classificar(lancs, regras){
  return lancs.map(l=>{
    const nd=normalizarDesc(l.desc);
    let cat=null, origem=null, conf=0;
    const r=regras.find(x=>nd.includes(String(x.padrao_texto||"").toUpperCase()));
    if(r){ cat=r.categoria_id; origem="regra"; conf=0.9; }
    if(!cat){
      /* cruza com os compromissos declarados: mesmo valor (±3%) e descrição parecida */
      const alvo=compsData.find(c=>{
        const cv=num(c.valor); if(!cv) return false;
        const bate=Math.abs(Math.abs(l.valor)-cv)/cv<=0.03;
        const tipoOk=(c.tipo==="receita")===(l.valor>0);
        const nomeOk=nd.includes(normalizarDesc(c.descricao).split(" ")[0]||"###");
        const diaOk=c.dia_vencimento?Math.abs(Number(l.data.slice(8,10))-Number(c.dia_vencimento))<=3:false;
        return bate&&tipoOk&&(nomeOk||diaOk);
      });
      if(alvo&&alvo.categoria_id){ cat=alvo.categoria_id; origem="fixo"; conf=0.75; }
      else if(alvo){ origem="fixo"; conf=0.6; }
    }
    return {...l, categoria_id:cat, origem, conf, normalizada:nd};
  });
}

function trocarContaImp(id){ impConta=id; renderExtratos(); }
async function lerArquivo(file){
  if(!file) return;
  const msg=document.getElementById("impMsg");
  impConta=document.getElementById("impConta").value;
  impCol=document.getElementById("impCol").value;
  impSinal=document.getElementById("impSinal").value;
  impArquivo=file.name;
  msg.className="msg"; msg.textContent="Lendo "+file.name+"...";
  try{
    let linhas;
    if(/\.pdf$/i.test(file.name)) linhas=await textoDoPDF(file);
    else linhas=linhasDoCSV(await file.text());
    let lancs=extrairLancamentos(linhas, impCol, impSinal);
    /* checagem de integridade: não grava lixo silenciosamente */
    if(lancs.length<2){
      msg.className="msg err";
      msg.innerHTML="Não encontrei lançamentos com data e valor neste arquivo ("+linhas.length+" linhas lidas).<br>Tente mudar a opção <b>“onde está o valor na linha”</b>, ou verifique se o PDF é de texto (não uma imagem escaneada).";
      return;
    }
    const datas=lancs.map(l=>l.data).sort();
    if(new Date(datas[datas.length-1])>new Date(Date.now()+86400000*40)){
      msg.className="msg err"; msg.textContent="As datas encontradas parecem inválidas (futuras demais). Confira o arquivo."; return;
    }
    /* regras + duplicidade */
    const { data:regras }=await sb.from("regras_classificacao").select("*").eq("cliente_id",perfilData.cliente_id);
    lancs=classificar(lancs, regras||[]);
    lancs.forEach(l=>l.hash=hashLanc(l.data,l.desc,l.valor,impConta));
    const { data:existentes }=await sb.from("lancamentos").select("hash").eq("conta_id",impConta);
    const jaTem=new Set((existentes||[]).map(x=>x.hash));
    const vistos=new Set();
    lancs.forEach(l=>{ l.duplicado = jaTem.has(l.hash)||vistos.has(l.hash); vistos.add(l.hash); });
    impLinhas=lancs;
    setImpEtapa("revisao");
  }catch(e){
    msg.className="msg err"; msg.textContent="Não consegui ler o arquivo: "+(e.message||e);
  }
}
function definirCategoria(i,catId){ if(impLinhas[i]){ impLinhas[i].categoria_id=catId||null; impLinhas[i].origem="manual"; } }
async function gravarImportacao(){
  const msg=document.getElementById("impMsg2");
  if(offline||!navigator.onLine){ msg.className="msg err"; msg.textContent="Sem internet: não é possível gravar agora."; return; }
  const novos=impLinhas.filter(l=>!l.duplicado);
  if(!novos.length){ msg.className="msg err"; msg.textContent="Nada novo para gravar."; return; }
  msg.className="msg"; msg.textContent="Gravando...";
  try{
    const auto=novos.filter(l=>l.origem==="regra"||l.origem==="fixo").length;
    const { data:imp, error:e1 }=await sb.from("importacoes").insert({
      cliente_id:perfilData.cliente_id, conta_id:impConta, nome_arquivo:impArquivo||"extrato",
      tipo_arquivo:/\.pdf$/i.test(impArquivo||"")?"PDF":"CSV", status:"concluido",
      total_lancamentos:novos.length, total_classificados_auto:auto,
      total_revisao_manual:novos.length-auto, total_duplicados:impLinhas.length-novos.length,
    }).select().single();
    if(e1) throw e1;
    const regs=novos.map(l=>({ cliente_id:perfilData.cliente_id, conta_id:impConta, categoria_id:l.categoria_id||null,
      importacao_id:imp.id, data:l.data, descricao:l.desc, descricao_normalizada:l.normalizada,
      valor:l.valor, status:l.origem==="manual"?"confirmado_manual":(l.categoria_id?"classificado_auto":"pendente"), hash:l.hash }));
    for(let i=0;i<regs.length;i+=200){
      const { error:e2 }=await sb.from("lancamentos").insert(regs.slice(i,i+200));
      if(e2) throw e2;
    }
    /* aprende: cada classificação manual vira regra para as próximas importações */
    const novasRegras=[];
    novos.filter(l=>l.origem==="manual"&&l.categoria_id).forEach(l=>{
      const p=l.normalizada.split(" ").slice(0,3).join(" ");
      if(p.length>=4 && !novasRegras.some(r=>r.padrao_texto===p))
        novasRegras.push({cliente_id:perfilData.cliente_id, perfil_id:perfilData.id, padrao_texto:p, categoria_id:l.categoria_id});
    });
    if(novasRegras.length) await sb.from("regras_classificacao").insert(novasRegras);
    /* deu certo → guarda o molde deste banco para as próximas importações */
    const tipoArq=/\.pdf$/i.test(impArquivo||"")?"PDF":"CSV";
    await salvarModelo(impConta, tipoArq, { coluna:impCol, sinal:impSinal, validado_em:new Date().toISOString().slice(0,10), lancamentos:novos.length });
    impLinhas=[]; setImpEtapa("pronto");
  }catch(e){ msg.className="msg err"; msg.textContent="Não consegui gravar: "+(e.message||e); }
}

async function criarCliente(ev){
  ev.preventDefault();
  const msg=document.getElementById("ncMsg");
  if(offline||!navigator.onLine){ msg.className="msg err"; msg.textContent="Sem internet: não é possível criar agora."; return; }
  const nome=document.getElementById("ncNome").value.trim();
  const v=id=>{ const el=document.getElementById(id); const s=el.value.trim(); return s===""?null:s; };
  const n=id=>{ const s=v(id); return s==null?null:Number(s); };
  try{
    const { data:cli, error:e1 }=await sb.from("clientes").insert({nome}).select().single();
    if(e1) throw e1;
    const { data:per, error:e2 }=await sb.from("perfis").insert({
      cliente_id:cli.id, nome:nome.split(" ")[0], nome_completo:nome,
      iniciais:nome.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase(),
      email:v("ncEmail"), telefone:v("ncTel"), data_nascimento:v("ncNasc"), estado_civil:v("ncEC"),
      dependentes:n("ncDep"), tipo_renda:v("ncRenda"),
      poupanca_mensal_atual:n("ncSobra"), reserva_atual:n("ncReserva"),
      conforto_financas:n("ncCf"), conforto_investimentos:n("ncCi"), maior_dificuldade:v("ncDif"),
      cdi_anual:CDI_PADRAO, pct_cdi:PCT_CDI_PADRAO, inflacao_anual:INFLACAO_PADRAO,
    }).select().single();
    if(e2) throw e2;
    await sb.from("categorias").insert(CATS_PADRAO.map(c=>({cliente_id:cli.id,nome:c[0],tipo:c[1],natureza:c[2]})));
    const salario=n("ncSalario");
    if(salario) await sb.from("compromissos_recorrentes").insert({
      cliente_id:cli.id, perfil_id:per.id, tipo:"receita", descricao:"Salário", valor:salario, dia_vencimento:n("ncDia"), essencial:true });
    msg.className="msg ok"; msg.textContent="Cliente criado! Focando nele agora...";
    clienteAtivo=cli.id; try{ localStorage.setItem("clienteAtivo",cli.id); }catch(e){}
    abaCliente="financas";
    setTimeout(loadData,600);
  }catch(err){ msg.className="msg err"; msg.textContent="Não consegui criar: "+(err.message||err); }
}

async function salvarPerfil(ev){
  ev.preventDefault();
  const msg=document.getElementById("edMsg");
  if(offline||!navigator.onLine){ msg.className="msg err"; msg.textContent="Sem internet."; return; }
  const v=id=>{ const s=document.getElementById(id).value.trim(); return s===""?null:s; };
  const n=id=>{ const s=v(id); return s==null?null:Number(s); };
  const upd={ nome_completo:v("edNome"), email:v("edEmail"), telefone:v("edTel"), data_nascimento:v("edNasc"),
    estado_civil:v("edEC")==="—"?null:v("edEC"), dependentes:n("edDep"),
    tipo_renda:v("edRenda")==="—"?null:v("edRenda"), poupanca_mensal_atual:n("edSobra"), reserva_atual:n("edReserva"),
    variavel_essencial:n("edVarEss"), conforto_financas:n("edCf"), conforto_investimentos:n("edCi"),
    perfil_investidor:v("edPi"), inflacao_anual:n("edInfl"), maior_dificuldade:v("edDif")==="—"?null:v("edDif") };
  if(upd.nome_completo) upd.nome=upd.nome_completo.split(" ")[0];
  const { error }=await sb.from("perfis").update(upd).eq("id",perfilData.id);
  if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
  msg.className="msg ok"; msg.textContent="Dados salvos ✓"; loadData();
}
async function vincularLogin(ev){
  ev.preventDefault();
  const msg=document.getElementById("lkMsg");
  if(offline||!navigator.onLine){ msg.className="msg err"; msg.textContent="Sem internet."; return; }
  const id=document.getElementById("lkUid").value.trim(), email=document.getElementById("lkEmail").value.trim();
  if(!/^[0-9a-f-]{36}$/i.test(id)){ msg.className="msg err"; msg.textContent="O código do usuário parece inválido."; return; }
  const { error }=await sb.from("usuarios").upsert({id, cliente_id:perfilData.cliente_id, email, role:document.getElementById("lkRole").value});
  if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
  msg.className="msg ok"; msg.textContent="Login vinculado ✓ O cliente já consegue entrar.";
}
