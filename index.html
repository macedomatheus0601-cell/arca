<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Cliente — Consultoria Financeira</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eef0f4; --bg2: #e7eaf0;
    --card: #ffffff; --card2: #f5f6f9;
    --border: #e6e8ee; --border-strong: #d7dae2;
    --text: #141821; --text2: #565d6b; --muted: #9198a5;
    --brand: #2560c8; --brand2: #1c4fa6;
    --green: #0f9d6b; --green-bg: #e4f6ee;
    --amber: #d1810a; --amber-bg: #fbeed6;
    --teal: #0a97b0; --teal-bg: #dff3f6;
    --rose: #dc4b52; --rose-bg: #fce7e8;
    --slate: #6b7385; --slate-bg: #eceef3;
    --grad-hero: linear-gradient(140deg, #2f6bd6 0%, #163f8f 100%);
    --grad-foco: linear-gradient(135deg, #109c7e 0%, #0b8ea4 100%);
    --shadow: 0 4px 18px rgba(30,40,70,0.08);
    --shadow-lg: 0 12px 34px rgba(30,40,70,0.14);
  }
  :root[data-theme="dark"] {
    --bg: #0c0e13; --bg2: #101319;
    --card: #171a21; --card2: #1f232c;
    --border: #262b35; --border-strong: #333a46;
    --text: #f0f1f4; --text2: #aab2c0; --muted: #727a89;
    --brand: #5b8bf5; --brand2: #3a6ad8;
    --green: #35c98e; --green-bg: #10281f;
    --amber: #e0a13c; --amber-bg: #2c2210;
    --teal: #3bb9cf; --teal-bg: #0e2429;
    --rose: #ec6d73; --rose-bg: #2c1517;
    --slate: #8d94a5; --slate-bg: #1e222b;
    --grad-hero: linear-gradient(140deg, #2a5cc0 0%, #143a80 100%);
    --grad-foco: linear-gradient(135deg, #0e8a6e 0%, #0a7f95 100%);
    --shadow: 0 4px 18px rgba(0,0,0,0.4);
    --shadow-lg: 0 14px 36px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; transition: background .3s, color .3s; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input { font-family: inherit; }

  /* ---------- LOGIN ---------- */
  .login-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; background: radial-gradient(900px 500px at 50% -10%, var(--bg2), var(--bg)); }
  .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 30px 26px; width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
  .login-mark { width: 54px; height: 54px; border-radius: 16px; background: var(--grad-hero); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: var(--shadow); }
  .login-mark svg { width: 28px; height: 28px; }
  .login-card h1 { font-size: 20px; font-weight: 750; text-align: center; letter-spacing: -0.3px; }
  .login-card .lsub { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 22px; }
  .field { margin-bottom: 13px; }
  .field label { font-size: 12.5px; color: var(--text2); font-weight: 600; display: block; margin-bottom: 5px; }
  .field input { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--card2); color: var(--text); font-size: 15px; outline: none; transition: border-color .15s; }
  .field input:focus { border-color: var(--brand); }
  .login-btn { width: 100%; height: 47px; border-radius: 12px; background: var(--grad-hero); color: #fff; font-size: 15px; font-weight: 700; margin-top: 8px; transition: transform .1s, opacity .2s; }
  .login-btn:active { transform: scale(0.98); }
  .login-btn:disabled { opacity: 0.6; cursor: default; }
  .login-err { background: var(--rose-bg); color: var(--rose); font-size: 12.5px; font-weight: 600; padding: 9px 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
  .login-err.show { display: block; }

  /* ---------- SHELL ---------- */
  .shell { display: none; min-height: 100vh; }
  .shell.show { display: grid; grid-template-columns: 232px 1fr; }
  .sidebar { background: var(--card); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; }
  .brand .mark { width: 38px; height: 38px; border-radius: 11px; background: var(--grad-hero); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand .mark svg { width: 20px; height: 20px; }
  .brand .bname { font-weight: 750; font-size: 15px; letter-spacing: -0.3px; }
  .brand .bsub { font-size: 10.5px; color: var(--muted); }
  .nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; color: var(--text2); font-size: 14px; font-weight: 600; width: 100%; text-align: left; transition: background .15s, color .15s; }
  .nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
  .nav-item:hover { background: var(--card2); color: var(--text); }
  .nav-item.active { background: color-mix(in srgb, var(--brand) 13%, transparent); color: var(--brand); }
  .side-foot { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .side-foot .u-name { font-size: 12.5px; font-weight: 700; }
  .side-foot .u-role { font-size: 10.5px; color: var(--muted); }

  .main { padding: 22px 26px 60px; max-width: 1000px; width: 100%; }
  .main-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .page-title { font-size: 22px; font-weight: 780; letter-spacing: -0.4px; }
  .top-actions { display: flex; gap: 9px; }
  .top-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--card); color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: transform .1s, border-color .2s; }
  .top-btn:active { transform: scale(0.92); }
  .top-btn svg { width: 19px; height: 19px; }
  .avatar { width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; background: var(--grad-hero); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; box-shadow: var(--shadow); }

  @media (max-width: 820px) {
    .shell.show { grid-template-columns: 1fr; }
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; flex-direction: row; border-right: none; border-top: 1px solid var(--border); padding: 7px 8px; z-index: 50; box-shadow: 0 -4px 18px rgba(0,0,0,0.07); }
    .brand, .side-foot { display: none; }
    .nav { flex-direction: row; gap: 2px; }
    .nav-item { flex-direction: column; gap: 3px; padding: 7px 4px; font-size: 10px; border-radius: 10px; justify-content: center; }
    .nav-item svg { width: 21px; height: 21px; }
    .main { padding: 18px 15px 92px; }
  }

  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 800; margin: 26px 2px 12px; }
  .eyebrow:first-child { margin-top: 4px; }

  /* ---------- HERO ---------- */
  .hero { background: var(--grad-hero); border-radius: 22px; color: #fff; padding: 22px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,0.10); }
  .hero::before { content: ""; position: absolute; right: 40px; bottom: -80px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,0.07); }
  .gauge-wrap { position: relative; width: 168px; height: 168px; flex-shrink: 0; z-index: 1; }
  .gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge-score { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .gauge-of { font-size: 12px; opacity: 0.8; margin-top: 3px; }
  .hero-info { flex: 1; min-width: 180px; z-index: 1; }
  .hero-tag { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.82; font-weight: 700; }
  .hero-title { font-size: 22px; font-weight: 750; margin: 5px 0 3px; letter-spacing: -0.4px; }
  .hero-desc { font-size: 13.5px; opacity: 0.9; line-height: 1.5; margin-bottom: 14px; }
  .pillars { display: flex; gap: 8px; flex-wrap: wrap; }
  .pillar { background: rgba(255,255,255,0.14); border-radius: 12px; padding: 8px 11px; flex: 1; min-width: 96px; }
  .pillar .p-lbl { font-size: 10.5px; opacity: 0.82; display: flex; align-items: center; gap: 5px; }
  .pillar .p-val { font-size: 16px; font-weight: 700; margin-top: 3px; }
  .p-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* ---------- TILES ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 13px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .chip { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .chip svg { width: 20px; height: 20px; }
  .chip.blue { background: color-mix(in srgb, var(--brand) 15%, transparent); color: var(--brand); }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .chip.teal { background: var(--teal-bg); color: var(--teal); }
  .chip.rose { background: var(--rose-bg); color: var(--rose); }
  .chip.slate { background: var(--slate-bg); color: var(--slate); }
  .t-label { font-size: 12.5px; color: var(--text2); }
  .t-value { font-size: 25px; font-weight: 780; letter-spacing: -0.6px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .t-foot { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11.5px; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .badge.g { background: var(--green-bg); color: var(--green); }
  .badge.y { background: var(--amber-bg); color: var(--amber); }
  .badge.r { background: var(--rose-bg); color: var(--rose); }
  .badge.n { background: var(--slate-bg); color: var(--slate); }
  .spark { margin-top: 10px; }

  .foco { background: var(--grad-foco); color: #fff; border-radius: 20px; padding: 20px 22px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px; }
  .foco .f-ic { width: 52px; height: 52px; border-radius: 15px; flex-shrink: 0; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
  .foco .f-ic svg { width: 26px; height: 26px; }
  .foco .f-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.85; font-weight: 700; }
  .foco .f-title { font-size: 18px; font-weight: 750; margin: 3px 0 4px; letter-spacing: -0.3px; }
  .foco .f-desc { font-size: 13px; opacity: 0.92; line-height: 1.45; }

  .goals { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 13px; }
  .goal { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
  .ring-wrap { position: relative; flex-shrink: 0; width: 68px; height: 68px; }
  .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 750; }
  .goal .g-body { flex: 1; min-width: 0; }
  .goal .g-name { font-size: 15px; font-weight: 720; display: flex; align-items: center; gap: 7px; }
  .goal .g-name .mini-ic { width: 15px; height: 15px; }
  .goal .g-vals { font-size: 12.5px; color: var(--text2); margin: 5px 0 6px; font-variant-numeric: tabular-nums; }
  .goal .g-vals b { color: var(--text); }
  .goal .g-when { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; background: var(--card2); padding: 3px 9px; border-radius: 20px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 13px; }
  .card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-h .ct { font-size: 15px; font-weight: 730; }
  .card-h .cs { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .card-h .c-end { text-align: right; }
  .card-h .c-end .lbl { font-size: 11px; color: var(--muted); }
  .card-h .c-end .val { font-size: 20px; font-weight: 780; color: var(--brand); letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text2); margin: 4px 0 8px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .ln { width: 20px; height: 3px; border-radius: 2px; display: inline-block; background: var(--brand); }
  .ln.d { background: repeating-linear-gradient(90deg, var(--brand) 0 3px, transparent 3px 7px); }
  svg.chart { width: 100%; height: auto; display: block; }
  .cap { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.5; }

  /* ---------- metas detalhadas ---------- */
  .goal-full { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 13px; }
  .gf-top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .gf-body { flex: 1; min-width: 190px; }
  .gf-name { font-size: 16px; font-weight: 740; display: flex; align-items: center; gap: 8px; }
  .gf-name .ic { width: 18px; height: 18px; display: inline-flex; }
  .gf-vals { font-size: 13px; color: var(--text2); margin: 6px 0 9px; font-variant-numeric: tabular-nums; }
  .gf-vals b { color: var(--text); }
  .track { height: 9px; background: var(--card2); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; border-radius: 5px; }
  .gf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--border); }
  .mini { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
  .mini .m-l { font-size: 11px; color: var(--muted); }
  .mini .m-v { font-size: 16px; font-weight: 730; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 13px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; box-shadow: var(--shadow); }
  .stat .s-l { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 7px; }
  .stat .s-v { font-size: 21px; font-weight: 770; margin-top: 6px; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
  .sign { width: 21px; height: 21px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }

  /* ---------- donut + legenda ---------- */
  .donut-row { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .donut-box { position: relative; width: 190px; flex-shrink: 0; margin: 0 auto; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-center .dc-v { font-size: 19px; font-weight: 780; letter-spacing: -0.4px; }
  .donut-center .dc-l { font-size: 11px; color: var(--muted); }
  .dleg { flex: 1; min-width: 190px; }
  .dleg-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .dleg-row:first-child { border-top: none; }
  .dleg-row .dl-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dleg-row .dl-v { font-weight: 680; font-variant-numeric: tabular-nums; }
  .dleg-row .dl-p { font-size: 11.5px; color: var(--muted); width: 38px; text-align: right; }

  /* ---------- simulador ---------- */
  .sim { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
  .sim input[type=range] { flex: 1; min-width: 160px; accent-color: var(--brand); height: 26px; }
  .sim-val { font-size: 14px; font-weight: 720; color: var(--brand); min-width: 96px; text-align: right; font-variant-numeric: tabular-nums; }
  .sim-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin-top: 14px; }

  /* ---------- perfil ---------- */
  .id-card { background: var(--grad-hero); color: #fff; border-radius: 22px; padding: 22px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; display: flex; align-items: center; gap: 17px; flex-wrap: wrap; }
  .id-card::after { content: ""; position: absolute; right: -50px; top: -70px; width: 210px; height: 210px; border-radius: 50%; background: rgba(255,255,255,0.09); }
  .id-av { width: 66px; height: 66px; border-radius: 20px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 25px; font-weight: 750; flex-shrink: 0; z-index: 1; }
  .id-info { z-index: 1; flex: 1; min-width: 170px; }
  .id-name { font-size: 21px; font-weight: 760; letter-spacing: -0.4px; }
  .id-sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .id-tags { display: flex; gap: 7px; margin-top: 11px; flex-wrap: wrap; }
  .id-tag { background: rgba(255,255,255,0.17); border-radius: 20px; padding: 4px 11px; font-size: 11.5px; font-weight: 650; }
  .arc-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 13px; }
  .arc-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); text-align: center; }
  .arc-box { position: relative; width: 124px; margin: 0 auto 6px; }
  .arc-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .arc-center .ac-v { font-size: 24px; font-weight: 790; letter-spacing: -0.5px; }
  .arc-center .ac-of { font-size: 10.5px; color: var(--muted); }
  .arc-card .ac-l { font-size: 13px; font-weight: 660; }
  .arc-card .ac-d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 11px; }
  .info-c { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 13px 15px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
  .info-c .ic-b { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--card2); color: var(--text2); }
  .info-c .ic-b svg { width: 17px; height: 17px; }
  .info-c .i-l { font-size: 11px; color: var(--muted); }
  .info-c .i-v { font-size: 14px; font-weight: 660; margin-top: 1px; }
  .diff-card { background: var(--amber-bg); border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent); border-radius: 18px; padding: 17px 19px; display: flex; align-items: center; gap: 14px; }
  .diff-card .d-ic { width: 44px; height: 44px; border-radius: 13px; background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .diff-card .d-ic svg { width: 22px; height: 22px; }
  .diff-card .d-l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px; color: var(--amber); font-weight: 750; }
  .diff-card .d-v { font-size: 16px; font-weight: 700; margin-top: 2px; color: var(--text); }

  .state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .state .big { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M18 6h3v3"/></svg></div>
    <h1>Sua visão financeira</h1>
    <div class="lsub">Entre para acompanhar suas metas</div>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm">

/* ================= CÁLCULOS ================= */
function ativoNoMes(c,off){
  const hoje=new Date(); const alvo=new Date(hoje.getFullYear(),hoje.getMonth()+off,1);
  if(c.data_fim){ if(new Date(c.data_fim+"T00:00:00")<alvo) return false; }
  else if(c.total_parcelas!=null&&c.parcela_atual!=null){
    const rest=Number(c.total_parcelas)-Number(c.parcela_atual);
    if(off>rest) return false;
  }
  if(c.data_inicio){ if(new Date(c.data_inicio+"T00:00:00")>new Date(alvo.getFullYear(),alvo.getMonth()+1,0)) return false; }
  return true;
}
function receitaMes(off){ return compsData.filter(c=>c.tipo==="receita"&&ativoNoMes(c,off)).reduce((s,c)=>s+(Number(c.valor)||0),0); }
function fixosMes(off){ return compsData.filter(c=>c.tipo==="despesa"&&ativoNoMes(c,off)).reduce((s,c)=>s+(Number(c.valor)||0),0); }
function projetar(n=24, extra=0){
  const out=[]; let saldo=F.reserva;
  out.push({off:0, receita:receitaMes(0), despesa:fixosMes(0)+F.variaveis, sobra:F.sobra, saldo});
  for(let i=1;i<=n;i++){
    const rec=receitaMes(i), desp=fixosMes(i)+F.variaveis, sob=rec-desp+extra;
    saldo+=sob; out.push({off:i, receita:rec, despesa:desp, sobra:sob, saldo});
  }
  return out;
}
function planoAlocacao(extra=0, horizonte=120){
  const itens=metas.map(m=>({nome:m.nome, cor:m.cor, ic:m.ic, falta:Math.max(0,m.alvo-m.atual), mes:null}));
  const proj=projetar(horizonte,extra);
  for(let i=1;i<=horizonte;i++){
    let disp=proj[i]?proj[i].sobra:0;
    if(disp<=0) continue;
    for(const it of itens){
      if(it.mes!==null||it.falta<=0) continue;
      if(disp<=0) break;
      const usa=Math.min(disp,it.falta); it.falta-=usa; disp-=usa;
      if(it.falta<=0.01) it.mes=i;
    }
    if(itens.every(it=>it.mes!==null)) break;
  }
  return itens;
}
function calcScore(){
  const pPoup=Math.max(0,Math.min(1,F.taxa/0.20)), pDiv=Math.max(0,Math.min(1,1-F.divida/0.30)), pRes=Math.max(0,Math.min(1,F.mesesReserva/6));
  return { score:Math.round((pPoup*0.34+pDiv*0.30+pRes*0.36)*100), pPoup, pDiv, pRes };
}
function focoInfo(){
  if(F.divida>=0.30) return {t:"Reduzir as dívidas caras", d:"Suas dívidas consomem uma fatia grande da renda. O primeiro passo é aliviar isso — é o que destrava o resto."};

  if(F.taxa<0.10) return {t:"Organizar e sobrar mais", d:"Sobra pouco no fim do mês. Vamos mapear os gastos e liberar mais espaço para as suas metas."};
  return {t:"Acelerar seus objetivos", d:"Sua base está saudável! Agora é hora de dar velocidade às suas metas e fazer o dinheiro render mais."};
}

/* ================= GRÁFICOS (SVG) ================= */
function gaugeSvg(score){
  const cx=90,cy=90,r=72,C=2*Math.PI*r,arc=(C*0.75)*(score/100);
  return `<svg viewBox="0 0 180 180" style="width:100%;height:100%">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.5" stop-color="#8fe6c3"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs>
    <g transform="rotate(135 ${cx} ${cy})">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C*0.75).toFixed(1)} ${(C*0.25).toFixed(1)}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${arc.toFixed(1)} ${(C-arc).toFixed(1)}"/></g></svg>`;
}
function ringSvg(pct,color,sw=7){
  const r=28,C=2*Math.PI*r,arc=C*Math.max(0,Math.min(100,pct))/100;
  return `<svg viewBox="0 0 68 68" style="width:100%;height:100%">
    <circle cx="34" cy="34" r="${r}" fill="none" stroke="${cssv("--card2")}" stroke-width="${sw}"/>
    <circle cx="34" cy="34" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${arc.toFixed(1)} ${(C-arc).toFixed(1)}" transform="rotate(-90 34 34)"/></svg>`;
}
function arcSvg(pct,color){
  const cx=62,cy=62,r=48,C=2*Math.PI*r,full=C*0.72,arc=full*Math.max(0,Math.min(1,pct));
  return `<svg viewBox="0 0 124 124" style="width:100%;height:auto">
    <g transform="rotate(140 ${cx} ${cy})">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cssv("--card2")}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${full.toFixed(1)} ${(C-full).toFixed(1)}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${arc.toFixed(1)} ${(C-arc).toFixed(1)}"/></g></svg>`;
}
function sparkSvg(vals,color){
  const W=140,H=34,min=Math.min(...vals),max=Math.max(...vals),x=i=>i*W/(vals.length-1),y=v=>H-2-((v-min)/(max-min||1))*(H-6);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const id="sg"+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:34px">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
/* linha de saldo acumulado */
function saldoSvg(proj){
  const values=proj.map(p=>p.saldo);
  const W=720,H=270,padT=16,padB=24,padL=6,padR=6;
  const min=Math.min(...values),max=Math.max(...values),range=(max-min)||1;
  const x=i=>padL+i*(W-padL-padR)/(values.length-1), y=v=>padT+(max-v)/range*(H-padT-padB);
  const brand=cssv("--brand"),grid=cssv("--border"),tick=cssv("--muted"),card=cssv("--card");
  let grd="";
  for(let g=0;g<=3;g++){ const gy=padT+g*(H-padT-padB)/3,gv=max-g*range/3;
    grd+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="${grid}" stroke-width="1"/><text x="${padL+2}" y="${(gy-5).toFixed(1)}" fill="${tick}" font-size="11" font-family="Segoe UI,sans-serif">${fmtK(gv)}</text>`; }
  let xl="";
  for(let i=0;i<values.length;i+=6) xl+=`<text x="${x(i).toFixed(1)}" y="${H-6}" fill="${tick}" font-size="10.5" text-anchor="middle" font-family="Segoe UI,sans-serif">${labelMes(i)}</text>`;
  const pts=values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const id="ar"+Math.random().toString(36).slice(2,7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Projeção do saldo acumulado">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${brand}" stop-opacity="0.26"/><stop offset="1" stop-color="${brand}" stop-opacity="0"/></linearGradient></defs>
    ${grd}${xl}
    <polygon points="${padL},${H-padB} ${pts} ${(W-padR)},${H-padB}" fill="url(#${id})"/>
    <polyline points="${pts}" fill="none" stroke="${brand}" stroke-width="3.2" stroke-dasharray="1.5 7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="${x(0).toFixed(1)}" cy="${y(values[0]).toFixed(1)}" r="6" fill="${brand}" stroke="${card}" stroke-width="3"/>
    <text x="${x(0).toFixed(1)}" y="${(y(values[0])-13).toFixed(1)}" fill="${tick}" font-size="11" text-anchor="start" font-family="Segoe UI,sans-serif">hoje</text></svg>`;
}
/* barras receita x despesa */
function barsSvg(proj,n=12){
  const d=proj.slice(1,n+1);
  const W=720,H=225,padT=12,padB=26,padL=8,padR=8;
  const max=Math.max(...d.map(x=>Math.max(x.receita,x.despesa)))*1.08||1;
  const gw=(W-padL-padR)/d.length, bw=Math.min(13,gw*0.30), base=H-padB;
  const y=v=>padT+(1-v/max)*(base-padT);
  const green=cssv("--green"),rose=cssv("--rose"),tick=cssv("--muted"),grid=cssv("--border");
  let g="";
  for(let k=0;k<=3;k++){ const gy=padT+k*(base-padT)/3; g+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W-padR}" y2="${gy.toFixed(1)}" stroke="${grid}" stroke-width="1"/>`; }
  let bars="";
  d.forEach((p,i)=>{
    const cx=padL+gw*i+gw/2;
    const hr=Math.max(2,base-y(p.receita)), hd=Math.max(2,base-y(p.despesa));
    bars+=`<rect x="${(cx-bw-1).toFixed(1)}" y="${y(p.receita).toFixed(1)}" width="${bw.toFixed(1)}" height="${hr.toFixed(1)}" rx="3" fill="${green}"/>`;
    bars+=`<rect x="${(cx+1).toFixed(1)}" y="${y(p.despesa).toFixed(1)}" width="${bw.toFixed(1)}" height="${hd.toFixed(1)}" rx="3" fill="${rose}"/>`;
    if(i%2===0) bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" fill="${tick}" font-size="10.5" text-anchor="middle" font-family="Segoe UI,sans-serif">${labelMes(p.off)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Receita e despesa por mês">${g}<line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="${grid}" stroke-width="1.2"/>${bars}</svg>`;
}
/* rosca de composição */
function donutSvg(items){
  const total=items.reduce((s,i)=>s+i.valor,0)||1;
  const cx=100,cy=100,r=72,C=2*Math.PI*r;
  let acc=0,segs="";
  items.forEach(it=>{
    const len=C*(it.valor/total), vis=Math.max(1,len-3);
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.cor}" stroke-width="27" stroke-dasharray="${vis.toFixed(1)} ${(C-vis).toFixed(1)}" stroke-dashoffset="${(-acc).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=len;
  });
  return `<svg viewBox="0 0 200 200" style="width:100%;height:auto" role="img" aria-label="Composição das despesas">${segs}</svg>`;
}
/* linha do tempo das metas */
function timelineSvg(plano){
  const ating=plano.filter(p=>p.mes!==null).map(p=>p.mes);
  const maxM=Math.max(12,...(ating.length?ating:[12]));
  const W=720,padL=8,padR=8,rowH=44,padT=30;
  const H=padT+plano.length*rowH+6;
  const x=m=>padL+(m/maxM)*(W-padL-padR);
  const tick=cssv("--muted"),grid=cssv("--border"),text=cssv("--text"),card=cssv("--card");
  const step=maxM<=12?3:(maxM<=30?6:12);
  let axis="";
  for(let m=0;m<=maxM;m+=step){
    axis+=`<line x1="${x(m).toFixed(1)}" y1="20" x2="${x(m).toFixed(1)}" y2="${H-4}" stroke="${grid}" stroke-width="1"/>`;
    axis+=`<text x="${x(m).toFixed(1)}" y="13" fill="${tick}" font-size="10.5" text-anchor="middle" font-family="Segoe UI,sans-serif">${labelMes(m)}</text>`;
  }
  let rows="";
  plano.forEach((p,i)=>{
    const yy=padT+i*rowH+12;
    const end=p.mes!==null?x(p.mes):x(maxM);
    rows+=`<text x="${padL+1}" y="${yy-4}" fill="${text}" font-size="11.5" font-weight="600" font-family="Segoe UI,sans-serif">${esc(p.nome)}</text>`;
    rows+=`<rect x="${padL}" y="${yy}" width="${Math.max(6,end-padL).toFixed(1)}" height="13" rx="6.5" fill="${p.cor}" opacity="${p.mes!==null?0.9:0.28}"/>`;
    if(p.mes!==null){
      rows+=`<circle cx="${end.toFixed(1)}" cy="${yy+6.5}" r="6.5" fill="${p.cor}" stroke="${card}" stroke-width="2.5"/>`;
      const anchor = end > W*0.78 ? "end" : "start";
      const tx = anchor==="end" ? end-12 : end+12;
      rows+=`<text x="${tx.toFixed(1)}" y="${yy+11}" fill="${tick}" font-size="10.5" text-anchor="${anchor}" font-family="Segoe UI,sans-serif">${labelMes(p.mes)}</text>`;
    } else {
      rows+=`<text x="${(W-padR-2).toFixed(1)}" y="${yy+11}" fill="${tick}" font-size="10.5" text-anchor="end" font-family="Segoe UI,sans-serif">além de 10 anos</text>`;
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Linha do tempo das metas">${axis}${rows}</svg>`;
}
/* barra comparativa simples */
function compareSvg(a,b,corA,corB){
  const max=Math.max(a,b)||1,W=260,H=46,bh=15;
  const wA=(a/max)*W, wB=(b/max)*W;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:46px">
    <rect x="0" y="2" width="${Math.max(3,wA).toFixed(1)}" height="${bh}" rx="4" fill="${corA}"/>
    <rect x="0" y="${bh+8}" width="${Math.max(3,wB).toFixed(1)}" height="${bh}" rx="4" fill="${corB}"/></svg>`;
}

  document.getElementById("simSobra").textContent=fmt(F.sobra+extraPoupanca);
  document.getElementById("simCap").textContent=`Guardando ${fmt(F.sobra+extraPoupanca)} por mês, em 2 anos seu saldo acumulado chega a cerca de ${fmt(fim)}.`;
  const ps=planoAlocacao(extraPoupanca), pb=planoAlocacao(0);
  document.getElementById("simMetas").innerHTML=ps.map((p,i)=>{
    const b=pb[i], ganho=(b.mes!==null&&p.mes!==null)?b.mes-p.mes:0;
    return `<div class="dleg-row"><span class="sw" style="background:${p.cor}"></span><span class="dl-n">${esc(p.nome)}</span>
      <span class="dl-v">${p.mes!==null?labelMes(p.mes):"+10 anos"}</span>
      <span class="dl-p" style="color:${ganho>0?cssv("--green"):"var(--muted)"}">${ganho>0?"−"+ganho+"m":""}</span></div>`;
  }).join("");
}

/* ================= PÁGINA: PERFIL ================= */
function renderPerfil(){
  const p=perfilData||{};
  const anos=idade(p.data_nascimento);
  const tags=[];
  if(p.tipo_renda) tags.push(esc(p.tipo_renda));
  if(p.estado_civil) tags.push(esc(p.estado_civil));
  if(p.dependentes!=null) tags.push(p.dependentes+" dependente"+(p.dependentes===1?"":"s"));
  const idCard=`
    <div class="id-card">
      <div class="id-av">${F.inicial}</div>
      <div class="id-info">
        <div class="id-name">${esc(p.nome_completo||F.nome)}</div>
        <div class="id-sub">${anos!=null?anos+" anos":""}${anos!=null&&p.email?" · ":""}${esc(p.email||"")}</div>
        ${tags.length?`<div class="id-tags">${tags.map(t=>`<span class="id-tag">${t}</span>`).join("")}</div>`:""}
      </div>
    </div>`;

  const cf=p.conforto_financas, ci=p.conforto_investimentos;
  const nivel=n=>["","iniciante","aprendendo","intermediário","confortável","avançado"][Number(n)||0]||"—";
  const corN=n=>{ n=Number(n)||0; return n>=4?cssv("--green"):(n>=3?cssv("--teal"):cssv("--amber")); };
  const arcs=`
    <div class="arc-row">
      <div class="arc-card">
        <div class="arc-box">${arcSvg(cf!=null?cf/5:0, corN(cf))}<div class="arc-center"><div class="ac-v">${cf!=null?cf:"–"}</div><div class="ac-of">de 5</div></div></div>
        <div class="ac-l">Finanças do dia a dia</div><div class="ac-d">${cf!=null?nivel(cf):"não informado"}</div>
      </div>
      <div class="arc-card">
        <div class="arc-box">${arcSvg(ci!=null?ci/5:0, corN(ci))}<div class="arc-center"><div class="ac-v">${ci!=null?ci:"–"}</div><div class="ac-of">de 5</div></div></div>
        <div class="ac-l">Investimentos</div><div class="ac-d">${ci!=null?nivel(ci):"não informado"}</div>
      </div>
      <div class="arc-card" style="display:flex;flex-direction:column;justify-content:center;text-align:left">
        <div class="ic-b" style="width:38px;height:38px;border-radius:11px;background:var(--green-bg);color:var(--green);margin-bottom:9px">${svgIcon("piggy")}</div>
        <div class="ac-l">Já investe hoje?</div>
        <div class="ac-d" style="font-size:13px;color:var(--text2);margin-top:3px">${p.ja_investe?esc(p.ja_investe):"não informado"}</div>
      </div>
    </div>`;

  const dif = p.maior_dificuldade ? `
    <div class="eyebrow">O ponto a trabalhar</div>
    <div class="diff-card"><div class="d-ic">${svgIcon("target")}</div>
      <div><div class="d-l">Maior dificuldade hoje</div><div class="d-v">${esc(p.maior_dificuldade)}</div></div></div>` : "";

  const dados=[
    {ic:"user",l:"Nome completo",v:p.nome_completo||p.nome||null},
    {ic:"mail",l:"E-mail",v:p.email},
    {ic:"phone",l:"Telefone",v:p.telefone},
    {ic:"cake",l:"Nascimento",v:dataBR(p.data_nascimento)},
    {ic:"heart",l:"Estado civil",v:p.estado_civil},
    {ic:"users",l:"Dependentes",v:p.dependentes!=null?String(p.dependentes):null},
    {ic:"brief",l:"Tipo de renda",v:p.tipo_renda},
  ].map(d=>`<div class="info-c"><div class="ic-b">${svgIcon(d.ic)}</div><div style="min-width:0"><div class="i-l">${d.l}</div><div class="i-v">${d.v?esc(d.v):ND}</div></div></div>`).join("");

  const resumoFin=`
    <div class="eyebrow">Seu retrato financeiro</div>
    <div class="grid2">
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--green")} 16%, transparent);color:${cssv("--green")}">+</span>Renda mensal</div><div class="s-v">${fmt(F.renda)}</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--rose")} 16%, transparent);color:${cssv("--rose")}">−</span>Gastos fixos</div><div class="s-v">${fmt(F.fixos)}</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--brand")} 16%, transparent);color:${cssv("--brand")}">=</span>Sobra por mês</div><div class="s-v">${fmt(F.sobra)}</div></div>
      <div class="stat"><div class="s-l"><span class="sign" style="background:color-mix(in srgb, ${cssv("--teal")} 16%, transparent);color:${cssv("--teal")}">◈</span>Guardado hoje</div><div class="s-v">${fmt(F.reserva)}</div></div>
    </div>`;

  document.getElementById("pageContent").innerHTML =
    idCard +
    `<div class="eyebrow">Sua relação com o dinheiro</div>` + arcs +
    dif +
    resumoFin +
    `<div class="eyebrow">Dados cadastrais</div><div class="info-grid">${dados}</div>` +
    `<div class="note">Para atualizar estes dados, fale com seu consultor.</div>`;
}
